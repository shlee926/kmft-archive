<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의사축구대회 아카이브</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230D5932'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* layout: sticky brand bar + tournament pills → hero → tabs → panels (info / results / standings / awards / teams / registration) */

:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface-2: #EFEDE7;
  --fg: #141720;
  --fg-muted: #5B6472;
  --border: #DFDCD3;
  --divider: #CDC9BD;
  --accent: #0D5932;
  --accent-ink: #FFFFFF;
  --accent-weak: #E6EEE9;
  --accent-strong: #0A4425;
  --gold: #B88A1A;
  --silver: #8A94A3;
  --bronze: #A86735;
  --young-a: #15803D;
  --young-b: #1D4ED8;
  --young: #15803D;
  --veteran: #C2410C;
  --score-ink: #0A1F3B;
  --danger: #B91C1C;
  --f-display: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-numeric: "Oswald", "Noto Sans KR", system-ui, sans-serif;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0E13;
    --surface: #151921;
    --surface-2: #1D222C;
    --fg: #E8EBF0;
    --fg-muted: #8690A1;
    --border: #2A303C;
    --divider: #353C49;
    --accent: #4ADE80;
    --accent-ink: #0A1D12;
    --accent-weak: #0E1E16;
    --accent-strong: #16A34A;
    --gold: #E6B429;
    --silver: #A9B3C2;
    --bronze: #D08A54;
    --young-a: #22C55E;
    --young-b: #3B82F6;
    --young: #22C55E;
    --veteran: #F97316;
    --score-ink: #BFDBFE;
    --danger: #F87171;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0C0E13;
  --surface: #151921;
  --surface-2: #1D222C;
  --fg: #E8EBF0;
  --fg-muted: #8690A1;
  --border: #2A303C;
  --divider: #353C49;
  --accent: #4ADE80;
  --accent-ink: #0A1D12;
  --accent-weak: #0E1E16;
  --accent-strong: #16A34A;
  --gold: #E6B429;
  --silver: #A9B3C2;
  --bronze: #D08A54;
  --young-a: #22C55E;
  --young-b: #3B82F6;
  --young: #22C55E;
  --veteran: #F97316;
  --score-ink: #BFDBFE;
  --danger: #F87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--f-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 0 48px;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}

.wrap { max-width: 1180px; margin-inline: auto; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in oklab, var(--bg) 90%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border);
  margin-inline: -16px;
  padding-inline: 16px;
}
.topbar-inner {
  max-width: 1180px;
  margin-inline: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 10px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: 0.01em;
  font-size: 15px;
  min-width: 0;
}
.brand .mark {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  position: relative;
  flex-shrink: 0;
}
.brand .mark::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1.5px solid var(--accent-ink);
  border-radius: 50%;
}
.brand .mark::after {
  content: "";
  position: absolute;
  inset: 10px 2px;
  border-left: 1.5px solid var(--accent-ink);
  border-right: 1.5px solid var(--accent-ink);
}
.brand small {
  font-weight: 400;
  color: var(--fg-muted);
  font-size: 12px;
  margin-left: 2px;
}
.tour-pills {
  display: flex;
  gap: 6px;
  margin-left: auto;
  flex-wrap: wrap;
}
.tour-pill {
  font-family: var(--f-numeric);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  letter-spacing: 0.03em;
  white-space: nowrap;
  position: relative;
}
.tour-pill[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.tour-pill .live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--danger);
  margin-right: 5px;
  vertical-align: middle;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  width: 34px; height: 34px;
  cursor: pointer;
  color: var(--fg);
  font-size: 15px;
}

.hero {
  padding-block: 32px 20px;
  border-bottom: 1px solid var(--divider);
}
.hero-eyebrow {
  font-family: var(--f-numeric);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--fg-muted);
  text-transform: uppercase;
  font-weight: 600;
}
.hero-title {
  font-weight: 900;
  font-size: clamp(28px, 5vw, 44px);
  margin: 8px 0 12px;
  letter-spacing: -0.015em;
  line-height: 1.1;
  text-wrap: balance;
}
.hero-meta {
  display: flex;
  gap: 20px;
  color: var(--fg-muted);
  font-size: 14px;
  flex-wrap: wrap;
}
.hero-meta span { display: inline-flex; gap: 6px; align-items: baseline; }
.hero-meta b { color: var(--fg); font-weight: 500; }
.hero-meta .label {
  font-family: var(--f-numeric);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-muted);
}
.registration-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-top: 12px;
}
.registration-badge .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-ink);
  animation: pulse 1.6s ease-in-out infinite;
}

.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--divider);
  margin-top: 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none;
  border: none;
  padding: 12px 16px;
  font-family: var(--f-body);
  font-size: 15px;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.tab[aria-selected="true"] {
  color: var(--fg);
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.tab[hidden] { display: none; }

.panel { padding-block: 28px; min-height: 300px; }

/* === Info panel (notice / rules / venue) === */
.info-section { margin-bottom: 36px; }
.info-section:last-child { margin-bottom: 0; }
.info-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--divider);
}
.info-head h2 {
  font-weight: 700;
  font-size: 22px;
  margin: 0;
}
.info-head .count {
  font-family: var(--f-numeric);
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 0.08em;
}
.md {
  color: var(--fg);
  font-size: 15px;
  line-height: 1.75;
}
.md h2 {
  font-size: 17px;
  font-weight: 700;
  margin: 24px 0 10px;
  color: var(--fg);
  letter-spacing: 0.005em;
}
.md h2:first-child { margin-top: 0; }
.md h3 {
  font-size: 15px;
  font-weight: 700;
  margin: 18px 0 6px;
  color: var(--fg);
}
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md strong { color: var(--fg); font-weight: 700; }
.md hr { border: none; border-top: 1px solid var(--divider); margin: 20px 0; }
.md blockquote {
  border-left: 3px solid var(--accent);
  padding: 2px 14px;
  margin: 10px 0;
  color: var(--fg-muted);
  background: var(--surface);
}
.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.info-callout {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 18px 20px;
}

.venue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  gap: 16px;
}
.venue-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.venue-card img {
  width: 100%;
  height: auto;
  display: block;
  background: var(--surface-2);
  cursor: zoom-in;
}
.venue-card figcaption {
  padding: 10px 14px;
  font-size: 13px;
  color: var(--fg-muted);
  border-top: 1px solid var(--divider);
}

/* Image lightbox */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* === Results === */
.rounds { display: grid; gap: 28px; }
.round {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 720px) {
  .round { grid-template-columns: 1fr; gap: 10px; }
}
.round-label {
  font-family: var(--f-numeric);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0.03em;
  color: var(--fg);
}
.round-time {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 2px;
  font-family: var(--f-numeric);
  letter-spacing: 0.05em;
}
.matches {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 12px;
  min-width: 0;
}
.match {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  min-width: 0;
  position: relative;
}
.match-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}
.league-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.league-name {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-muted);
  font-weight: 700;
}
.field-label {
  margin-left: auto;
  font-size: 11px;
  color: var(--fg-muted);
  font-family: var(--f-numeric);
  letter-spacing: 0.04em;
}
.match-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}
.team { font-weight: 500; font-size: 15px; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.team.home { text-align: right; }
.team.away { text-align: left; }
.score {
  font-family: var(--f-numeric);
  font-weight: 700;
  font-size: 22px;
  padding: 2px 12px;
  color: var(--score-ink);
  background: var(--surface-2);
  border-radius: var(--r-sm);
  min-width: 64px;
  text-align: center;
  letter-spacing: 0.04em;
}
.score.pending { color: var(--fg-muted); background: transparent; font-size: 13px; letter-spacing: 0.1em; }
.scorers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--divider);
  font-size: 12px;
  color: var(--fg-muted);
  line-height: 1.55;
}
.scorers > div.home { text-align: right; }
.scorers > div.away { text-align: left; }
.scorers .scorer-row { display: block; }
.penalty-note {
  margin-top: 10px;
  padding: 6px 10px;
  background: var(--accent-weak);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  letter-spacing: 0.05em;
  border-radius: var(--r-sm);
}
.match.playoff {
  border-color: var(--accent);
  border-width: 1.5px;
}
.playoff-tag {
  position: absolute;
  top: -9px; left: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--f-numeric);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--r-sm);
  letter-spacing: 0.08em;
}

/* === Standings === */
.standings-group { margin-bottom: 36px; }
.standings-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.standings-head .league-dot { width: 14px; height: 14px; }
.standings-head h2 {
  font-weight: 700;
  font-size: 20px;
  margin: 0;
  letter-spacing: 0.005em;
}
.standings-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
}
.standings-tbl {
  width: 100%;
  border-collapse: collapse;
  min-width: 560px;
}
.standings-tbl th,
.standings-tbl td {
  padding: 10px 10px;
  text-align: center;
  font-size: 14px;
  border-bottom: 1px solid var(--divider);
}
.standings-tbl th {
  background: var(--surface-2);
  color: var(--fg-muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  font-family: var(--f-numeric);
}
.standings-tbl td.team-cell {
  text-align: left;
  font-weight: 500;
  padding-left: 16px;
}
.standings-tbl tr:last-child td { border-bottom: none; }
.standings-tbl td.pts {
  font-family: var(--f-numeric);
  font-weight: 700;
  font-size: 17px;
  color: var(--fg);
}
.standings-tbl td.num { font-family: var(--f-numeric); font-weight: 500; }
.standings-tbl td.gd.pos { color: var(--young-a); }
.standings-tbl td.gd.neg { color: var(--veteran); }
.rank-cell { width: 56px; }
.rank-medal {
  display: inline-flex;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--divider);
  align-items: center;
  justify-content: center;
  font-family: var(--f-numeric);
  font-size: 12px;
  font-weight: 700;
  color: var(--fg);
}
.rank-medal.g1 { background: var(--gold); color: #fff; border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in oklab, var(--gold) 20%, transparent); }
.rank-medal.g2 { background: var(--silver); color: #fff; border-color: var(--silver); }
.rank-medal.g3 { background: var(--bronze); color: #fff; border-color: var(--bronze); }
.med-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  background: var(--surface-2);
  color: var(--fg-muted);
  border-radius: 3px;
  margin-left: 6px;
  font-weight: 500;
  letter-spacing: 0.02em;
  vertical-align: middle;
}
.tiebreak-note {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 10px;
  line-height: 1.5;
}

/* === Awards === */
.awards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 20px;
}
.award-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
}
.award-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--divider);
}
.award-head h2 {
  font-weight: 700;
  font-size: 22px;
  margin: 0;
}
.award-list { display: grid; gap: 14px; }
.award-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  align-items: baseline;
  gap: 14px;
}
.award-label {
  font-family: var(--f-numeric);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  font-weight: 700;
}
.award-val {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
}
.award-val .sub {
  display: block;
  font-size: 12px;
  color: var(--fg-muted);
  font-weight: 400;
  margin-top: 2px;
}

/* === Teams === */
.teams-section { margin-bottom: 28px; }
.teams-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.team-chip {
  font-size: 13px;
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--fg);
}
.team-chip.med { background: var(--surface-2); color: var(--fg-muted); }

/* === Registration === */
.reg-intro {
  background: var(--accent-weak);
  color: var(--accent-strong);
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: var(--r-md);
  padding: 16px 20px;
  margin-bottom: 24px;
  font-size: 14px;
  line-height: 1.65;
}
.reg-intro strong { color: var(--accent); font-weight: 700; }
.reg-deadlines {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed color-mix(in oklab, var(--accent) 25%, transparent);
  display: grid;
  gap: 8px;
}
.reg-deadline {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: baseline;
  font-size: 14px;
}
.reg-deadline .ddl-label {
  font-weight: 600;
  color: var(--accent-strong);
  min-width: 160px;
}
.reg-deadline .ddl-value {
  font-family: var(--f-numeric);
  font-weight: 500;
  color: var(--fg);
  letter-spacing: 0.02em;
}
.reg-warning {
  margin-top: 12px;
  padding: 8px 12px;
  background: color-mix(in oklab, var(--danger) 10%, transparent);
  color: var(--danger);
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 600;
}
.reg-notes {
  margin-top: 12px;
  font-size: 13px;
  color: var(--accent-strong);
}

:root[data-theme="dark"] .reg-intro,
:root[data-theme="dark"] .reg-deadline .ddl-label,
:root[data-theme="dark"] .reg-notes,
:root:not([data-theme="light"]) .reg-intro,
:root:not([data-theme="light"]) .reg-deadline .ddl-label,
:root:not([data-theme="light"]) .reg-notes {
  color: var(--fg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .reg-intro,
  :root:not([data-theme="light"]) .reg-deadline .ddl-label,
  :root:not([data-theme="light"]) .reg-notes {
    color: var(--fg);
  }
}

.reg-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--divider);
}
.reg-tab {
  background: none;
  border: none;
  padding: 10px 14px;
  font-family: var(--f-body);
  font-size: 15px;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.reg-tab[aria-selected="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 24px;
  max-width: 720px;
}
.form-row { margin-bottom: 16px; }
.form-row label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 6px;
}
.form-row label .req { color: var(--danger); margin-left: 2px; }
.form-row input,
.form-row select,
.form-row textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-family: inherit;
  font-size: 15px;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent);
}
.form-row .hint {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 4px;
}
.radio-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.radio-opt {
  flex: 1 1 120px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}
.radio-opt:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-weak);
  color: var(--accent-strong);
}
.radio-opt input { accent-color: var(--accent); }

.roster-tbl {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
.roster-tbl th,
.roster-tbl td {
  padding: 6px 4px;
  text-align: left;
  font-size: 13px;
  vertical-align: middle;
}
.roster-tbl th {
  font-weight: 600;
  color: var(--fg-muted);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--divider);
}
.roster-tbl td input {
  padding: 7px 9px;
  font-size: 13px;
  width: 100%;
}
.roster-tbl td.actions {
  width: 40px;
  text-align: center;
}
.row-del {
  background: none;
  border: none;
  color: var(--fg-muted);
  cursor: pointer;
  font-size: 18px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
}
.row-del:hover { color: var(--danger); background: var(--surface-2); }

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-secondary {
  background: var(--surface);
  color: var(--fg);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-2); }

/* === Toast === */
.toast {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--fg);
  padding: 14px 22px;
  border-radius: var(--r-md);
  box-shadow: 0 10px 40px rgba(0,0,0,0.18);
  font-size: 14px;
  font-weight: 500;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  max-width: calc(100vw - 32px);
  text-align: center;
  line-height: 1.5;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--danger); }

.empty {
  padding: 72px 20px;
  text-align: center;
  color: var(--fg-muted);
  font-size: 14px;
}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span>의사축구대회 아카이브 <small>· 대한의사축구연맹</small></span>
    </div>
    <div class="tour-pills" id="tour-pills" role="tablist"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="테마 전환" title="테마 전환">◐</button>
  </div>
</div>

<div class="wrap">
  <div id="hero" class="hero"></div>
  <div class="tabs" id="tabs" role="tablist">
    <button class="tab" data-tab="info" role="tab">대회 안내</button>
    <button class="tab" data-tab="results" role="tab">경기 결과</button>
    <button class="tab" data-tab="standings" role="tab">순위표</button>
    <button class="tab" data-tab="awards" role="tab">시상</button>
    <button class="tab" data-tab="teams" role="tab">참가팀</button>
    <button class="tab" data-tab="register" role="tab">참가 신청</button>
  </div>
  <div id="panel" class="panel"></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="이미지 확대 보기">
  <img id="lightbox-img" alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// =========================================================
// State
// =========================================================
let tournaments = {};
let currentTournamentId = null;
let currentTab = null;
let currentRegTab = 'team';

const LEAGUE_COLORS = {
  'young-a': 'var(--young-a)',
  'young-b': 'var(--young-b)',
  'young':   'var(--young)',
  'veteran': 'var(--veteran)',
};

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  if (!Array.isArray(children)) children = [children];
  for (const c of children) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return e;
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${y}년 ${+m}월 ${+d}일`;
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const parts = iso.split('T');
  const [y, mo, d] = parts[0].split('-').map(Number);
  if (!y || !mo || !d) return iso;
  const dateObj = new Date(y, mo - 1, d);
  const dow = ['일','월','화','수','목','금','토'][dateObj.getDay()];
  const base = `${y}년 ${mo}월 ${d}일 (${dow})`;
  if (!parts[1]) return base;
  const [h, mi] = parts[1].split(':').map(Number);
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  const timeStr = (mi === 0 || isNaN(mi)) ? `${ampm} ${h12}시` : `${ampm} ${h12}시 ${mi}분`;
  return `${base} ${timeStr}`;
}

function leagueById(t, id) {
  return (t.leagues || []).find(l => l.id === id);
}

function hasTabContent(t, tab) {
  if (!t) return false;
  switch (tab) {
    case 'info':      return !!(t.notice || t.rules || (t.venueImages && t.venueImages.length));
    case 'results':   return !!(t.matches && t.matches.length);
    case 'standings': return !!(t.matches && t.matches.length && t.leagues && t.leagues.length);
    case 'awards':    return !!(t.awards && Object.keys(t.awards).length);
    case 'teams':     return !!(t.leagues && t.leagues.length);
    case 'register':  return !!(t.registration && t.registration.open);
  }
  return false;
}

function firstAvailableTab(t) {
  const order = ['info', 'results', 'standings', 'awards', 'teams', 'register'];
  for (const tab of order) if (hasTabContent(t, tab)) return tab;
  return 'info';
}

// =========================================================
// Standings
// =========================================================
function h2hResult(matches, leagueId, teamA, teamB) {
  for (const m of matches) {
    if (m.leagueId !== leagueId) continue;
    if (m.kind && m.kind !== 'group') continue;
    if (m.homeScore == null || m.awayScore == null) continue;
    if (m.home === teamA && m.away === teamB) {
      return m.homeScore > m.awayScore ? 1 : m.homeScore < m.awayScore ? -1 : 0;
    }
    if (m.home === teamB && m.away === teamA) {
      return m.homeScore > m.awayScore ? -1 : m.homeScore < m.awayScore ? 1 : 0;
    }
  }
  return 0;
}

function computeStandings(tournament, league) {
  const teams = {};
  for (const t of league.teams) {
    teams[t] = { team: t, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
  }
  const matches = tournament.matches || [];
  for (const m of matches) {
    if (m.leagueId !== league.id) continue;
    if (m.kind && m.kind !== 'group') continue;
    if (m.homeScore == null || m.awayScore == null) continue;
    if (!teams[m.home] || !teams[m.away]) continue;
    teams[m.home].mp++; teams[m.away].mp++;
    teams[m.home].gf += m.homeScore; teams[m.home].ga += m.awayScore;
    teams[m.away].gf += m.awayScore; teams[m.away].ga += m.homeScore;
    if (m.homeScore > m.awayScore) { teams[m.home].w++; teams[m.home].pts += 3; teams[m.away].l++; }
    else if (m.homeScore < m.awayScore) { teams[m.away].w++; teams[m.away].pts += 3; teams[m.home].l++; }
    else { teams[m.home].d++; teams[m.away].d++; teams[m.home].pts++; teams[m.away].pts++; }
  }
  const medSet = new Set(league.medStudentTeams || []);
  const rows = Object.values(teams).map(r => ({ ...r, gd: r.gf - r.ga, isMed: medSet.has(r.team) }));
  rows.sort((a, b) => {
    if (a.isMed !== b.isMed) return a.isMed ? 1 : -1;
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.gd !== a.gd) return b.gd - a.gd;
    if (b.gf !== a.gf) return b.gf - a.gf;
    return -h2hResult(matches, league.id, a.team, b.team);
  });
  return rows;
}

// =========================================================
// Render
// =========================================================
function render() {
  renderTourPills();
  renderHero();
  renderTabs();
  renderPanel();
}

function renderTourPills() {
  const pills = document.getElementById('tour-pills');
  pills.innerHTML = '';
  const list = Object.values(tournaments).sort((a, b) =>
    (b.date || '').localeCompare(a.date || '')
  );
  if (!list.length) {
    currentTournamentId = null;
    return;
  }
  if (!currentTournamentId || !tournaments[currentTournamentId]) {
    const h = (location.hash || '').replace('#', '');
    currentTournamentId = (h && tournaments[h]) ? h : list[0].id;
  }
  for (const t of list) {
    const isOpen = t.registration && t.registration.open;
    const btn = el('button', {
      class: 'tour-pill',
      role: 'tab',
      'aria-selected': t.id === currentTournamentId ? 'true' : 'false',
      onclick: () => {
        currentTournamentId = t.id;
        currentTab = null; // reset to first available
        try { location.hash = t.id; } catch {}
        render();
      },
    });
    if (isOpen) btn.appendChild(el('span', { class: 'live-dot', 'aria-label': '접수중' }));
    btn.appendChild(document.createTextNode(t.shortName || t.name || t.id));
    pills.appendChild(btn);
  }
}

function renderHero() {
  const hero = document.getElementById('hero');
  hero.innerHTML = '';
  const t = tournaments[currentTournamentId];
  if (!t) {
    hero.appendChild(el('div', { class: 'hero-eyebrow' }, '대한의사축구연맹'));
    hero.appendChild(el('h1', { class: 'hero-title' }, '의사축구대회 아카이브'));
    hero.appendChild(el('div', { class: 'hero-meta' }, el('span', {}, '등록된 대회가 없습니다.')));
    return;
  }
  hero.appendChild(el('div', { class: 'hero-eyebrow' }, '대한의사축구연맹'));
  hero.appendChild(el('h1', { class: 'hero-title' }, t.name));
  const meta = el('div', { class: 'hero-meta' });
  if (t.date) meta.appendChild(el('span', {}, [el('span', { class: 'label' }, '일시'), el('b', {}, fmtDate(t.date))]));
  if (t.venue) meta.appendChild(el('span', {}, [el('span', { class: 'label' }, '장소'), el('b', {}, t.venue)]));
  hero.appendChild(meta);
  if (t.registration && t.registration.open) {
    const badge = el('div', { class: 'registration-badge' }, [
      el('span', { class: 'dot' }),
      el('span', {}, '참가 접수중'),
    ]);
    hero.appendChild(badge);
  }
}

function renderTabs() {
  const t = tournaments[currentTournamentId];
  if (!currentTab || !hasTabContent(t, currentTab)) {
    currentTab = firstAvailableTab(t);
  }
  for (const b of document.querySelectorAll('#tabs .tab')) {
    const tab = b.dataset.tab;
    const has = hasTabContent(t, tab);
    b.hidden = !has;
    const on = tab === currentTab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.onclick = () => { currentTab = tab; renderTabs(); renderPanel(); };
  }
}

function renderPanel() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  const t = tournaments[currentTournamentId];
  if (!t) return;
  if (currentTab === 'info') renderInfo(panel, t);
  else if (currentTab === 'results') renderResults(panel, t);
  else if (currentTab === 'standings') renderStandings(panel, t);
  else if (currentTab === 'awards') renderAwards(panel, t);
  else if (currentTab === 'teams') renderTeams(panel, t);
  else if (currentTab === 'register') renderRegister(panel, t);
}

// --- Info panel ---
function mdHtml(text) {
  if (!text) return '';
  if (window.marked) {
    try { return window.marked.parse(text, { gfm: true, breaks: true }); } catch (e) { console.error(e); }
  }
  // Fallback: naive paragraph splitting
  return text.split(/\n\n+/).map(p => `<p>${p.replace(/</g, '&lt;').replace(/\n/g, '<br>')}</p>`).join('');
}

function renderInfo(panel, t) {
  if (t.notice) {
    const sec = el('div', { class: 'info-section' });
    sec.appendChild(el('div', { class: 'info-head' }, [
      el('h2', {}, '📣 공지사항'),
    ]));
    const body = el('div', { class: 'info-callout md' });
    body.innerHTML = mdHtml(t.notice);
    sec.appendChild(body);
    panel.appendChild(sec);
  }
  if (t.rules) {
    const sec = el('div', { class: 'info-section' });
    sec.appendChild(el('div', { class: 'info-head' }, [
      el('h2', {}, '📖 대회 요강'),
    ]));
    const body = el('div', { class: 'info-callout md' });
    body.innerHTML = mdHtml(t.rules);
    sec.appendChild(body);
    panel.appendChild(sec);
  }
  if (t.venueImages && t.venueImages.length) {
    const sec = el('div', { class: 'info-section' });
    sec.appendChild(el('div', { class: 'info-head' }, [
      el('h2', {}, '📍 구장 안내도'),
    ]));
    const grid = el('div', { class: 'venue-grid' });
    for (const img of t.venueImages) {
      const src = typeof img === 'string' ? img : img.src;
      const caption = typeof img === 'string' ? '' : (img.caption || '');
      const fig = el('figure', { class: 'venue-card' });
      const im = el('img', { src, alt: caption, loading: 'lazy', onclick: () => openLightbox(src) });
      fig.appendChild(im);
      if (caption) fig.appendChild(el('figcaption', {}, caption));
      grid.appendChild(fig);
    }
    sec.appendChild(grid);
    panel.appendChild(sec);
  }
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('open');
}
document.addEventListener('click', (e) => {
  if (e.target.closest('.lightbox')) {
    document.getElementById('lightbox').classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// --- Results ---
function renderResults(panel, t) {
  const matches = t.matches || [];
  if (!matches.length) {
    panel.appendChild(el('div', { class: 'empty' }, '등록된 경기가 없습니다.'));
    return;
  }
  const byRound = new Map();
  for (const m of matches) {
    const key = m.roundOrder != null ? m.roundOrder : 999;
    if (!byRound.has(key)) byRound.set(key, { round: m.round || '', time: m.time || '', matches: [] });
    byRound.get(key).matches.push(m);
  }
  const container = el('div', { class: 'rounds' });
  const keys = [...byRound.keys()].sort((a, b) => a - b);
  for (const k of keys) {
    const grp = byRound.get(k);
    const roundEl = el('div', { class: 'round' });
    roundEl.appendChild(el('div', {}, [
      el('div', { class: 'round-label' }, grp.round || ''),
      grp.time ? el('div', { class: 'round-time' }, grp.time) : null,
    ]));
    const mts = el('div', { class: 'matches' });
    for (const m of grp.matches) mts.appendChild(renderMatchCard(m, t));
    roundEl.appendChild(mts);
    container.appendChild(roundEl);
  }
  panel.appendChild(container);
}

function renderMatchCard(m, t) {
  const league = leagueById(t, m.leagueId);
  const kind = m.kind || 'group';
  const card = el('div', { class: 'match' + (kind !== 'group' ? ' playoff' : '') });
  if (kind === 'final') card.appendChild(el('div', { class: 'playoff-tag' }, 'FINAL'));
  else if (kind === 'third_place') card.appendChild(el('div', { class: 'playoff-tag' }, '3·4위전'));
  else if (kind === 'semifinal') card.appendChild(el('div', { class: 'playoff-tag' }, '준결승'));

  const head = el('div', { class: 'match-head' });
  head.appendChild(el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[m.leagueId] || 'var(--fg-muted)'}` }));
  head.appendChild(el('span', { class: 'league-name' }, league?.name || m.leagueId || ''));
  if (m.field) head.appendChild(el('span', { class: 'field-label' }, m.field));
  card.appendChild(head);

  const hasScore = m.homeScore != null && m.awayScore != null;
  const row = el('div', { class: 'match-row' });
  row.appendChild(el('div', { class: 'team home' }, m.home));
  row.appendChild(el('div', { class: 'score' + (hasScore ? '' : ' pending') }, hasScore ? `${m.homeScore} : ${m.awayScore}` : 'VS'));
  row.appendChild(el('div', { class: 'team away' }, m.away));
  card.appendChild(row);

  const hs = (m.homeScorers || []).map(fmtScorer).filter(Boolean);
  const as = (m.awayScorers || []).map(fmtScorer).filter(Boolean);
  if (hs.length || as.length) {
    const sc = el('div', { class: 'scorers' });
    const hDiv = el('div', { class: 'home' });
    hs.forEach(s => hDiv.appendChild(el('span', { class: 'scorer-row' }, s)));
    const aDiv = el('div', { class: 'away' });
    as.forEach(s => aDiv.appendChild(el('span', { class: 'scorer-row' }, s)));
    sc.appendChild(hDiv);
    sc.appendChild(aDiv);
    card.appendChild(sc);
  }

  if (m.penaltyWinner) card.appendChild(el('div', { class: 'penalty-note' }, `승부차기 · ${m.penaltyWinner} 우승`));
  else if (m.note) card.appendChild(el('div', { class: 'penalty-note' }, m.note));
  return card;
}

function fmtScorer(s) {
  if (!s) return '';
  if (typeof s === 'string') return s;
  const mins = Array.isArray(s.minutes) ? s.minutes.map(x => `${x}'`).join(', ') : '';
  const name = s.name || '';
  const tag = s.og ? ' (OG)' : s.wc ? ' (WC)' : '';
  return [name + tag, mins].filter(Boolean).join(' ');
}

// --- Standings ---
function renderStandings(panel, t) {
  const leagues = t.leagues || [];
  if (!leagues.length) { panel.appendChild(el('div', { class: 'empty' }, '등록된 리그가 없습니다.')); return; }
  for (const lg of leagues) {
    const grp = el('div', { class: 'standings-group' });
    grp.appendChild(el('div', { class: 'standings-head' }, [
      el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[lg.id] || 'var(--fg-muted)'}` }),
      el('h2', {}, lg.name),
    ]));
    const rows = computeStandings(t, lg);
    const wrap = el('div', { class: 'standings-wrap' });
    const tbl = el('table', { class: 'standings-tbl' });
    tbl.innerHTML = `
      <thead><tr>
        <th class="rank-cell">순위</th>
        <th style="text-align:left; padding-left:16px">팀</th>
        <th>경기</th><th>승</th><th>무</th><th>패</th>
        <th>득</th><th>실</th><th>득실</th><th>승점</th>
      </tr></thead>`;
    const tbody = el('tbody');
    rows.forEach((r, i) => {
      const rank = i + 1;
      const medalCls = (!r.isMed && rank === 1) ? 'g1'
                      : (!r.isMed && rank === 2) ? 'g2'
                      : (!r.isMed && rank === 3 && rows.length >= 5) ? 'g3'
                      : '';
      const tr = el('tr');
      const gdCls = r.gd > 0 ? 'pos' : r.gd < 0 ? 'neg' : '';
      tr.innerHTML = `
        <td><span class="rank-medal ${medalCls}">${rank}</span></td>
        <td class="team-cell">${escapeHtml(r.team)}${r.isMed ? '<span class="med-badge">의대생</span>' : ''}</td>
        <td class="num">${r.mp}</td><td class="num">${r.w}</td><td class="num">${r.d}</td><td class="num">${r.l}</td>
        <td class="num">${r.gf}</td><td class="num">${r.ga}</td>
        <td class="num gd ${gdCls}">${r.gd > 0 ? '+' : ''}${r.gd}</td>
        <td class="pts">${r.pts}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    grp.appendChild(wrap);
    grp.appendChild(el('div', { class: 'tiebreak-note' },
      `순위 결정: 승점 → 득실차 → 다득점 → 승자승${(lg.medStudentTeams || []).length ? ` · ${lg.medStudentTeams.join(', ')}은(는) 의대 학생 참가팀으로 성적과 무관하게 최하위 처리` : ''}`));
    panel.appendChild(grp);
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Awards ---
function renderAwards(panel, t) {
  const awards = t.awards || {};
  const keys = Object.keys(awards);
  if (!keys.length) { panel.appendChild(el('div', { class: 'empty' }, '시상 결과가 아직 등록되지 않았습니다.')); return; }
  const container = el('div', { class: 'awards' });
  for (const k of keys) {
    const a = awards[k];
    const card = el('div', { class: 'award-card' });
    const colorVar = LEAGUE_COLORS[a.leagueKey || k] || 'var(--accent)';
    card.appendChild(el('div', { class: 'award-head' }, [
      el('span', { class: 'league-dot', style: `background:${colorVar}; width:14px; height:14px` }),
      el('h2', {}, a.title || k),
    ]));
    const list = el('div', { class: 'award-list' });
    const rows = [
      a.champion   ? { label: '우승',    val: a.champion } : null,
      a.runnerUp   ? { label: '준우승',  val: a.runnerUp } : null,
      a.thirdPlace ? { label: '3위',    val: a.thirdPlace } : null,
      a.topScorer  ? { label: '득점왕',  val: formatPerson(a.topScorer, true) } : null,
      a.mvp        ? { label: 'MVP',    val: formatPerson(a.mvp) } : null,
    ].filter(Boolean);
    for (const r of rows) {
      const valEl = el('div', { class: 'award-val' });
      if (typeof r.val === 'string') valEl.textContent = r.val;
      else valEl.appendChild(r.val);
      list.appendChild(el('div', { class: 'award-row' }, [el('div', { class: 'award-label' }, r.label), valEl]));
    }
    card.appendChild(list);
    container.appendChild(card);
  }
  panel.appendChild(container);
}

function formatPerson(p, showGoals) {
  if (!p) return '';
  if (typeof p === 'string') return p;
  const parts = [];
  if (p.team) parts.push(p.team);
  const name = (p.name || '') + (p.number ? ` ${p.number}번` : '');
  if (name) parts.push(name + (p.wc ? ' (WC)' : '') + ' 선생님');
  const main = parts.join(' · ');
  if (showGoals && p.goals != null) {
    const wrap = el('span');
    wrap.appendChild(document.createTextNode(main));
    wrap.appendChild(el('span', { class: 'sub' }, `${p.goals}골`));
    return wrap;
  }
  return main;
}

// --- Teams ---
function renderTeams(panel, t) {
  const leagues = t.leagues || [];
  if (!leagues.length) { panel.appendChild(el('div', { class: 'empty' }, '참가팀 정보가 없습니다.')); return; }
  for (const lg of leagues) {
    const sec = el('div', { class: 'teams-section' });
    sec.appendChild(el('div', { class: 'standings-head' }, [
      el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[lg.id] || 'var(--fg-muted)'}` }),
      el('h2', {}, lg.name),
    ]));
    const chips = el('div', { class: 'teams-chips' });
    const medSet = new Set(lg.medStudentTeams || []);
    for (const tm of lg.teams || []) {
      const isMed = medSet.has(tm);
      chips.appendChild(el('span', { class: 'team-chip' + (isMed ? ' med' : '') }, tm + (isMed ? ' · 의대생' : '')));
    }
    sec.appendChild(chips);
    panel.appendChild(sec);
  }
}

function renderRegister(panel, t) {
  const reg = t.registration || {};
  const email = reg.contactEmail || 'epiphany.h92@gmail.com';

  const intro = el('div', { class: 'reg-intro' });
  const header = el('div', {}, [
    el('strong', {}, t.name),
    ' 참가 접수중입니다.',
    el('br'),
    '아래 양식에 입력 후 제출하시면 운영진에게 자동으로 전달됩니다.',
  ]);
  intro.appendChild(header);

  // Deadlines block
  const deadlines = [];
  if (reg.teamDeadline) deadlines.push({ icon: '🏳️', label: '팀 참가 신청 마감', iso: reg.teamDeadline });
  if (reg.playerDeadline) deadlines.push({ icon: '👤', label: '선수 등록 마감', iso: reg.playerDeadline });
  if (!deadlines.length && reg.deadline) {
    deadlines.push({ icon: '📅', label: '접수 마감', iso: reg.deadline });
  }
  if (deadlines.length) {
    const ddl = el('div', { class: 'reg-deadlines' });
    for (const d of deadlines) {
      ddl.appendChild(el('div', { class: 'reg-deadline' }, [
        el('span', { class: 'ddl-label' }, `${d.icon} ${d.label}`),
        el('span', { class: 'ddl-value' }, fmtDateTime(d.iso)),
      ]));
    }
    intro.appendChild(ddl);
  }

  if (reg.lateRegistrationWarning !== false && (reg.teamDeadline || reg.playerDeadline || reg.lateRegistrationWarning)) {
    intro.appendChild(el('div', { class: 'reg-warning' }, '⚠️ 선수 등록 기한 이후의 등록은 인정되지 않습니다.'));
  }

  if (reg.notes) {
    intro.appendChild(el('div', { class: 'reg-notes' }, reg.notes));
  }
  panel.appendChild(intro);

  const tabs = el('div', { class: 'reg-tabs' });
  const teamTab = el('button', { class: 'reg-tab', 'aria-selected': currentRegTab === 'team' ? 'true' : 'false', onclick: () => { currentRegTab = 'team'; renderPanel(); } }, '🏳️ 팀 참가 신청');
  const playerTab = el('button', { class: 'reg-tab', 'aria-selected': currentRegTab === 'player' ? 'true' : 'false', onclick: () => { currentRegTab = 'player'; renderPanel(); } }, '👤 선수 등록');
  tabs.appendChild(teamTab);
  tabs.appendChild(playerTab);
  panel.appendChild(tabs);

  if (currentRegTab === 'team') panel.appendChild(renderTeamForm(t, email));
  else panel.appendChild(renderPlayerForm(t, email));
}

  const tbody = form.querySelector('#roster-body');

function formRow(label, required, control) {
  const row = el('div', { class: 'form-row' });

  if (required) lbl.appendChild(el('span', { class: 'req' }, '*'));
  row.appendChild(lbl);
  row.appendChild(control);
  return row;
}

function radioOpt(name, value, label) {
  const l = el('label', { class: 'radio-opt' });
  l.appendChild(el('input', { type: 'radio', name, value, required: 'required' }));
  l.appendChild(document.createTextNode(label));
  return l;
}

function showToast(msg, variant = 'ok', duration = 4000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('error');
  if (variant === 'error') t.classList.add('error');
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

function postToSheets(endpoint, payload) {
  // Google Apps Script Web Apps don't play well with fetch+no-cors due to a 302 redirect
  // step that strips CORS headers. The reliable pattern is a hidden iframe form POST,
  // which the browser handles natively.
  return new Promise((resolve, reject) => {
    const iframeName = 'kmft-submit-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.action = endpoint;
    form.method = 'POST';
    form.target = iframeName;
    form.enctype = 'application/x-www-form-urlencoded';
    form.acceptCharset = 'UTF-8';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);

    document.body.appendChild(form);

    let settled = false;
    const cleanup = (ok) => {
      if (settled) return;
      settled = true;
      try { form.remove(); } catch {}
      setTimeout(() => { try { iframe.remove(); } catch {} }, 1500);
      if (ok) resolve(); else reject(new Error('submission timed out'));
    };

    iframe.addEventListener('load', () => setTimeout(() => cleanup(true), 200));
    // Hard timeout in case iframe never fires load (shouldn't happen but defensive)
    setTimeout(() => cleanup(true), 8000);

    try { form.submit(); } catch (e) { cleanup(false); }
  });
}

function buildMailtoUrl(to, subject, body) {
  return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

async function submitTeamForm(t, email, form) {
  const data = new FormData(form);
  const league = data.get('league');
  const leagueName = league === 'young' ? '영맨' : league === 'veteran' ? '베테랑' : league;
  const teamName = (data.get('teamName') || '').trim();
  const captain = (data.get('captain') || '').trim();
  const contact = (data.get('contact') || '').trim();
  const notes = (data.get('notes') || '').trim();

  const endpoint = t.registration && t.registration.apiEndpoint;
  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = '전송 중...'; }

  if (endpoint) {
    try {
      await postToSheets(endpoint, {
        type: 'team',
        tournamentId: t.id,
        tournamentName: t.name,
        league: leagueName,
        teamName, captain, contact, notes,
        submittedAt: new Date().toISOString(),
      });
      showToast('✅ 참가 신청이 접수되었습니다. 운영진이 확인 후 안내드리겠습니다.');
      form.reset();
      if (btn) { btn.disabled = false; btn.textContent = '📝 참가 신청 제출'; }
      return;
    } catch (e) {
      console.error('API submit failed', e);
      showToast('⚠️ 접수 중 오류가 발생했습니다. 메일로 전송합니다.', 'error');
    }
  }

  // Fallback: mailto
  const subject = `[${t.shortName || t.name} 참가신청] ${leagueName} - ${teamName}`;
  const bodyLines = [`대회: ${t.name}`, `리그: ${leagueName}`, `팀명: ${teamName}`, `단장: ${captain}`];
  if (contact) bodyLines.push(`연락처: ${contact}`);
  if (notes) bodyLines.push('', '비고:', notes);
  window.location.href = buildMailtoUrl(email, subject, bodyLines.join('\n'));
  if (btn) { btn.disabled = false; btn.textContent = '📝 참가 신청 제출'; }
}

async function submitPlayerForm(t, email, form) {
  const teamName = (form.querySelector('[name="teamName"]').value || '').trim();
  const captain = (form.querySelector('[name="captain"]').value || '').trim();
  const notes = (form.querySelector('[name="notes"]').value || '').trim();
  const rows = form.querySelectorAll('#roster-body tr');
  const players = [];
  rows.forEach(tr => {
    const name = tr.querySelector('[name="playerName"]').value.trim();
    const number = tr.querySelector('[name="playerNumber"]').value.trim();
    const birth = tr.querySelector('[name="playerBirthYear"]').value.trim();
    const hospital = tr.querySelector('[name="playerHospital"]').value.trim();
    if (name || number || birth || hospital) players.push({ name, number, birth, hospital });
  });
  if (!teamName) { alert('팀명을 입력해주세요.'); return; }
  if (!players.length) { alert('최소 1명 이상의 선수를 입력해주세요.'); return; }

  const endpoint = t.registration && t.registration.apiEndpoint;
  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = '전송 중...'; }

  if (endpoint) {
    try {
      await postToSheets(endpoint, {
        type: 'players',
        tournamentId: t.id,
        tournamentName: t.name,
        teamName, captain, notes, players,
        submittedAt: new Date().toISOString(),
      });
      showToast(`✅ ${players.length}명의 선수가 등록되었습니다.`);
      form.reset();
      // Re-add empty roster rows after reset
      const tbody = form.querySelector('#roster-body');
      if (tbody) { tbody.innerHTML = ''; for (let i = 0; i < 11; i++) addRosterRow(form); }
      if (btn) { btn.disabled = false; btn.textContent = '📝 선수 명단 제출'; }
      return;
    } catch (e) {
      console.error('API submit failed', e);
      showToast('⚠️ 접수 중 오류가 발생했습니다. 메일로 전송합니다.', 'error');
    }
  }

  // Fallback: mailto
  const subject = `[${t.shortName || t.name} 선수등록] ${teamName} (${players.length}명)`;
  const bodyLines = [`대회: ${t.name}`, `팀명: ${teamName}`];
  if (captain) bodyLines.push(`담당자: ${captain}`);
  bodyLines.push('', `선수 명단 (${players.length}명):`);
  bodyLines.push('이름 / 등번호 / 출생연도 / 소속병원');
  players.forEach((p, i) => {
    bodyLines.push(`${i + 1}. ${p.name || '-'} / ${p.number || '-'} / ${p.birth || '-'} / ${p.hospital || '-'}`);
  });
  if (notes) bodyLines.push('', '비고:', notes);
  window.location.href = buildMailtoUrl(email, subject, bodyLines.join('\n'));
  if (btn) { btn.disabled = false; btn.textContent = '📝 선수 명단 제출'; }
}

// =========================================================
// Theme toggle
// =========================================================
function initTheme() {
  try {
    const saved = localStorage.getItem('kmft-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch {}
  document.getElementById('theme-toggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let next;
    if (cur === 'dark') next = 'light';
    else if (cur === 'light') next = 'dark';
    else next = sysDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('kmft-theme', next); } catch {}
  };
}

async function init() {
  initTheme();
  render();
  try {
    const res = await fetch('data/tournaments.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    const list = Array.isArray(payload) ? payload : (payload.tournaments || []);
    tournaments = {};
    for (const t of list) if (t && t.id) tournaments[t.id] = t;
    render();
  } catch (e) {
    console.error('Failed to load tournaments.json', e);
    document.getElementById('panel').innerHTML = '';
    document.getElementById('panel').appendChild(el('div', { class: 'empty' }, '대회 데이터를 불러오지 못했습니다.'));
  }
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#', '');
    if (h && tournaments[h] && h !== currentTournamentId) {
      currentTournamentId = h;
      currentTab = null;
      render();
    }
  });
}

init();
