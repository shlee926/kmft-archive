<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>의사축구대회 아카이브</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230D5932'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* layout: sticky brand bar + tournament pills → hero → tabs → panels (info / results / standings / awards / teams / registration) */

:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface-2: #EFEDE7;
  --fg: #141720;
  --fg-muted: #5B6472;
  --border: #DFDCD3;
  --divider: #CDC9BD;
  --accent: #0D5932;
  --accent-ink: #FFFFFF;
  --accent-weak: #E6EEE9;
  --accent-strong: #0A4425;
  --gold: #B88A1A;
  --silver: #8A94A3;
  --bronze: #A86735;
  --young-a: #15803D;
  --young-b: #1D4ED8;
  --young: #15803D;
  --veteran: #C2410C;
  --score-ink: #0A1F3B;
  --danger: #B91C1C;
  --f-display: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-numeric: "Oswald", "Noto Sans KR", system-ui, sans-serif;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0E13;
    --surface: #151921;
    --surface-2: #1D222C;
    --fg: #E8EBF0;
    --fg-muted: #8690A1;
    --border: #2A303C;
    --divider: #353C49;
    --accent: #4ADE80;
    --accent-ink: #0A1D12;
    --accent-weak: #0E1E16;
    --accent-strong: #16A34A;
    --gold: #E6B429;
    --silver: #A9B3C2;
    --bronze: #D08A54;
    --young-a: #22C55E;
    --young-b: #3B82F6;
    --young: #22C55E;
    --veteran: #F97316;
    --score-ink: #BFDBFE;
    --danger: #F87171;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0C0E13;
  --surface: #151921;
  --surface-2: #1D222C;
  --fg: #E8EBF0;
  --fg-muted: #8690A1;
  --border: #2A303C;
  --divider: #353C49;
  --accent: #4ADE80;
  --accent-ink: #0A1D12;
  --accent-weak: #0E1E16;
  --accent-strong: #16A34A;
  --gold: #E6B429;
  --silver: #A9B3C2;
  --bronze: #D08A54;
  --young-a: #22C55E;
  --young-b: #3B82F6;
  --young: #22C55E;
  --veteran: #F97316;
  --score-ink: #BFDBFE;
  --danger: #F87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--f-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 0 48px;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}

.wrap { max-width: 1180px; margin-inline: auto; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in oklab, var(--bg) 90%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border);
  margin-inline: -16px;
  padding-inline: 16px;
}
.topbar-inner {
  max-width: 1180px;
  margin-inline: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 10px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: 0.01em;
  font-size: 15px;
  min-width: 0;
}
.brand .mark {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  position: relative;
  flex-shrink: 0;
}
.brand .mark::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1.5px solid var(--accent-ink);
  border-radius: 50%;
}
.brand .mark::after {
  content: "";
  position: absolute;
  inset: 10px 2px;
  border-left: 1.5px solid var(--accent-ink);
  border-right: 1.5px solid var(--accent-ink);
}
.brand small {
  font-weight: 400;
  color: var(--fg-muted);
  font-size: 12px;
  margin-left: 2px;
}
.tour-pills {
  display: flex;
  gap: 6px;
  margin-left: auto;
  flex-wrap: wrap;
}
.tour-pill {
  font-family: var(--f-numeric);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  letter-spacing: 0.03em;
  white-space: nowrap;
  position: relative;
}
.tour-pill[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.tour-pill.cancelled {
  color: var(--fg-muted);
  border-style: dashed;
  background: transparent;
}
.tour-select {
  font-family: var(--f-numeric);
  font-size: 13px;
  padding: 6px 28px 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  max-width: 300px;
}
.tour-select.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
@media (max-width: 560px) {
  .topbar-inner > .brand { flex: 1 1 100%; }
  .tour-pills { flex: 1 1 0; min-width: 0; margin-left: 0; }
  .tour-select { flex: 1 1 100%; max-width: none; }
}
.tabs[hidden] { display: none; }
.off-term { margin-bottom: 36px; }
.off-term-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.off-term-head h2 { font-size: 20px; margin: 0; }
.off-term-head .period { color: var(--fg-muted); font-size: 13px; font-family: var(--f-numeric); }
.off-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.off-group { margin-bottom: 14px; }
.off-group-label { font-size: 12px; font-weight: 700; color: var(--fg-muted); letter-spacing: 0.04em; margin-bottom: 8px; }
.off-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.off-card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: 12px 14px; }
.off-card.lead { border-color: var(--accent); }
.off-role { font-size: 12px; color: var(--fg-muted); font-weight: 600; }
.off-name { font-size: 17px; font-weight: 700; margin-top: 2px; }
.off-team { font-size: 12px; color: var(--fg-muted); margin-left: 6px; font-weight: 500; }
.off-note { font-size: 11.5px; color: var(--fg-muted); margin-top: 4px; }
.off-compact { display: flex; flex-wrap: wrap; gap: 6px; }
.off-compact span { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--divider); background: var(--surface); }
.off-compact b { font-weight: 700; margin-left: 4px; }
.off-src { font-size: 12px; color: var(--fg-muted); margin-top: 6px; }
@media (max-width: 560px) { .off-grid { grid-template-columns: 1fr 1fr; } .off-name { font-size: 15px; } }
.tour-pill.records { font-weight: 700; }
.tour-pill.records[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.rec-section { margin-bottom: 40px; }
.rec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.rec-head h2 { font-size: 20px; margin: 0; }
.rec-head .sub { color: var(--fg-muted); font-size: 13px; }
.rec-teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.rec-team {
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.rec-team-top { display: flex; align-items: center; gap: 10px; }
.rec-rank {
  font-family: var(--f-numeric); font-weight: 700; font-size: 13px; width: 26px; height: 26px;
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); color: var(--fg-muted); flex: none;
}
.rec-rank.top { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rec-team-name { font-weight: 700; font-size: 16px; word-break: keep-all; }
.rec-count { margin-left: auto; font-family: var(--f-numeric); font-weight: 700; font-size: 20px; }
.rec-count small { font-size: 12px; color: var(--fg-muted); font-weight: 500; margin-left: 2px; }
.rec-stars { color: #d4a017; letter-spacing: 2px; font-size: 15px; line-height: 1.2; word-break: break-all; }
.rec-split { font-size: 12px; color: var(--fg-muted); }
.rec-titles { display: flex; flex-wrap: wrap; gap: 4px; }
.rec-chip {
  font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2);
  color: var(--fg); border: 1px solid var(--divider); cursor: pointer; white-space: nowrap;
}
.rec-chip:hover { border-color: var(--accent); }
.rec-tbl td, .rec-tbl th { text-align: left; }
.rec-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--surface); margin-left: auto; }
.rec-toggle button {
  all: unset; cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 999px; color: var(--fg-muted); font-weight: 600;
}
.rec-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.rec-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.rec-cols .rec-teams { grid-template-columns: 1fr; }
.rec-col-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; margin-bottom: 10px; }
@media (max-width: 720px) { .rec-cols { grid-template-columns: 1fr; } }
.rec-tbl td { font-size: 13.5px; word-break: keep-all; }
.rec-tbl td.t-name { font-weight: 700; white-space: nowrap; }
.rec-tbl td.t-name button {
  all: unset; cursor: pointer; border-bottom: 1px dashed var(--fg-muted);
}
.rec-tbl td.champ { font-weight: 700; }
.rec-tbl td.muted, .rec-tbl .dash { color: var(--fg-muted); }
.rec-tbl tr.group-start td { border-top: 2px solid var(--divider); }
.rec-note { color: var(--fg-muted); font-size: 12px; margin-top: 10px; line-height: 1.6; }
.cancel-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  color: var(--fg-muted);
  border: 1px dashed var(--border);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-top: 12px;
}
.tour-pill .live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--danger);
  margin-right: 5px;
  vertical-align: middle;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  width: 34px; height: 34px;
  cursor: pointer;
  color: var(--fg);
  font-size: 15px;
}

.hero {
  padding-block: 32px 20px;
  border-bottom: 1px solid var(--divider);
}
.hero-eyebrow {
  font-family: var(--f-numeric);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--fg-muted);
  text-transform: uppercase;
  font-weight: 600;
}
.hero-title {
  font-weight: 900;
  font-size: clamp(28px, 5vw, 44px);
  margin: 8px 0 12px;
  letter-spacing: -0.015em;
  line-height: 1.1;
  text-wrap: balance;
}
.hero-meta {
  display: flex;
  gap: 20px;
  color: var(--fg-muted);
  font-size: 14px;
  flex-wrap: wrap;
}
.hero-meta span { display: inline-flex; gap: 6px; align-items: baseline; }
.hero-meta b { color: var(--fg); font-weight: 500; }
.hero-meta .label {
  font-family: var(--f-numeric);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-muted);
}
.registration-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-top: 12px;
}
.registration-badge .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-ink);
  animation: pulse 1.6s ease-in-out infinite;
}

.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--divider);
  margin-top: 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none;
  border: none;
  padding: 12px 16px;
  font-family: var(--f-body);
  font-size: 15px;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.tab[aria-selected="true"] {
  color: var(--fg);
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.tab[hidden] { display: none; }

.panel { padding-block: 28px; min-height: 300px; }

/* === Info panel (notice / rules / venue) === */
.info-section { margin-bottom: 36px; }
.info-section:last-child { margin-bottom: 0; }
.info-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--divider);
}
.info-head h2 {
  font-weight: 700;
  font-size: 22px;
  margin: 0;
}
.info-head .count {
  font-family: var(--f-numeric);
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 0.08em;
}
.md {
  color: var(--fg);
  font-size: 15px;
  line-height: 1.75;
}
.md h2 {
  font-size: 17px;
  font-weight: 700;
  margin: 24px 0 10px;
  color: var(--fg);
  letter-spacing: 0.005em;
}
.md h2:first-child { margin-top: 0; }
.md h3 {
  font-size: 15px;
  font-weight: 700;
  margin: 18px 0 6px;
  color: var(--fg);
}
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md strong { color: var(--fg); font-weight: 700; }
.md hr { border: none; border-top: 1px solid var(--divider); margin: 20px 0; }
.md blockquote {
  border-left: 3px solid var(--accent);
  padding: 2px 14px;
  margin: 10px 0;
  color: var(--fg-muted);
  background: var(--surface);
}
.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.info-callout {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 18px 20px;
}

.venue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  gap: 16px;
}
.venue-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.venue-card img {
  width: 100%;
  height: auto;
  display: block;
  background: var(--surface-2);
  cursor: zoom-in;
}
.venue-card figcaption {
  padding: 10px 14px;
  font-size: 13px;
  color: var(--fg-muted);
  border-top: 1px solid var(--divider);
}

/* Image lightbox */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* === Schedule Grid === */
.schedule-grid-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
}
.schedule-grid {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
}
.schedule-grid th, .schedule-grid td {
  padding: 8px 8px;
  border-bottom: 1px solid var(--divider);
  border-right: 1px solid var(--divider);
  vertical-align: top;
  text-align: center;
}
.schedule-grid th:last-child, .schedule-grid td:last-child { border-right: none; }
.schedule-grid tr:last-child td { border-bottom: none; }
.schedule-grid th {
  background: var(--surface-2);
  color: var(--fg-muted);
  font-family: var(--f-numeric);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 1;
}
.schedule-grid .sg-round-h { width: 72px; }
.schedule-grid .sg-round-c { width: 72px; background: var(--surface-2); }
.schedule-grid .sg-round-label {
  font-family: var(--f-numeric);
  font-weight: 700;
  font-size: 16px;
  color: var(--fg);
  letter-spacing: 0.04em;
}
.schedule-grid .sg-cell {
  padding: 6px 6px;
  min-width: 140px;
}
.schedule-grid .sg-empty {
  color: var(--fg-muted);
  font-size: 13px;
  padding: 10px 0;
}
.schedule-grid .sg-game {
  padding: 8px 10px;
  margin: 2px 0;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  text-align: center;
}
.schedule-grid .sg-game.young {
  border-left: 3px solid var(--young);
}
.schedule-grid .sg-game.veteran {
  border-left: 3px solid var(--veteran);
  background: color-mix(in oklab, var(--veteran) 6%, var(--bg));
}
.schedule-grid .sg-game-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg-muted);
  margin-bottom: 3px;
  font-family: var(--f-numeric);
  letter-spacing: 0.04em;
}
.schedule-grid .sg-game-label {
  background: var(--surface-2);
  color: var(--fg);
  padding: 1px 6px;
  border-radius: 999px;
  font-weight: 700;
}
.schedule-grid .sg-game.veteran .sg-game-label {
  background: var(--veteran);
  color: #fff;
}
.schedule-grid .sg-game.young .sg-game-label {
  background: var(--young);
  color: #fff;
}
.schedule-grid .sg-game-time { color: var(--fg); font-weight: 500; }
.schedule-grid .sg-game-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 6px;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg);
}
.schedule-grid .sg-team {
  word-break: keep-all;
  min-width: 0;
  line-height: 1.3;
}
.schedule-grid .sg-team.home { text-align: right; }
.schedule-grid .sg-team.away { text-align: left; }
.schedule-grid .sg-vs { color: var(--fg-muted); font-size: 11px; font-family: var(--f-numeric); }
.sg-legend {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--fg-muted);
}
.sg-legend-chip {
  padding: 3px 10px;
  border-radius: 999px;
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
}
.sg-legend-chip.young { background: var(--young); }
.sg-legend-chip.veteran { background: var(--veteran); }

/* 원본 대진표 이미지 토글 */
.schedule-images-toggle {
  margin-top: 18px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  overflow: hidden;
}

<script>
// =========================================================
// State
// =========================================================
let tournaments = {};
let currentTournamentId = null;
let currentTab = null;
let currentRegTab = 'team';

const LEAGUE_COLORS = {
  'young-a': 'var(--young-a)',
  'young-b': 'var(--young-b)',
  'young':   'var(--young)',
  'veteran': 'var(--veteran)',
};

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  if (!Array.isArray(children)) children = [children];
  for (const c of children) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return e;
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${y}년 ${+m}월 ${+d}일`;
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const parts = iso.split('T');
  const [y, mo, d] = parts[0].split('-').map(Number);
  if (!y || !mo || !d) return iso;
  const dateObj = new Date(y, mo - 1, d);
  const dow = ['일','월','화','수','목','금','토'][dateObj.getDay()];
  const base = `${y}년 ${mo}월 ${d}일 (${dow})`;
  if (!parts[1]) return base;
  const [h, mi] = parts[1].split(':').map(Number);
  // Round hours → 오전/오후 N시 (e.g. "오후 12시"); non-zero minutes → 24-hour HH:MM (e.g. "23:59")
  let timeStr;
  if (mi === 0 || isNaN(mi)) {
    const ampm = h < 12 ? '오전' : '오후';
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    timeStr = `${ampm} ${h12}시`;
  } else {
    timeStr = `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
  }
  return `${base} ${timeStr}`;
}

// Insert zero-width space at natural break points so narrow mobile widths
// break Korean team names at semantic boundaries (성남 / 베테랑, 건양의대 / OB)
// instead of mid-syllable. Paired with CSS `word-break: keep-all`.
const TEAM_NAME_BREAKS = {
  '성남베테랑': '성남​베테랑',
  '성남영맨': '성남​영맨',
};
function formatTeamName(name) {
  if (!name) return '';
  const mapped = TEAM_NAME_BREAKS[name];
  if (mapped) return mapped;
  // Generic: Korean prefix + Latin suffix (OB/YB/FC/FA) → insert break before suffix
  return String(name).replace(/([가-힣]+)(OB|YB|FC|FA)(?=$|[^가-힣A-Za-z])/g, '$1​$2');
}

function leagueById(t, id) {
  return (t.leagues || []).find(l => l.id === id);
}

function hasTabContent(t, tab) {
  if (!t) return false;
  if (t.status === 'cancelled') return tab === 'info' && !!t.notice;
  switch (tab) {
    case 'info':      return !!(t.notice || t.rules || (t.venueImages && t.venueImages.length));
    case 'results':   return !!(t.matches && t.matches.length);
    case 'standings': return !t.hideStandings && !!(t.matches && t.matches.length && t.leagues && t.leagues.length);
    case 'awards':    return !!(t.awards && Object.keys(t.awards).length);
    case 'teams':     return !!(t.leagues && t.leagues.some(l => (l.teams || []).length));
    case 'register':  return !!(t.registration && (t.registration.open || t.registration.apiEndpoint));
  }
  return false;
}

const DEFAULT_TAB_LABELS = {
  info: '대회 안내',
  results: '경기 결과',
  standings: '순위표',
  awards: '시상',
  teams: '참가팀',
  register: '참가 신청',
};

function tabLabel(t, tab) {
  if (tab === 'register') {
    if (t && t.registration && t.registration.open) return '참가 신청';
    return '등록 현황';
  }
  return DEFAULT_TAB_LABELS[tab] || '';
}

function firstAvailableTab(t) {
  const order = ['info', 'results', 'standings', 'awards', 'teams', 'register'];
  for (const tab of order) if (hasTabContent(t, tab)) return tab;
  return 'info';
}

// =========================================================
// Standings
// =========================================================
function h2hResult(matches, leagueId, teamA, teamB) {
  for (const m of matches) {
    if (m.leagueId !== leagueId) continue;
    if (m.kind && m.kind !== 'group') continue;
    if (m.homeScore == null || m.awayScore == null) continue;
    if (m.home === teamA && m.away === teamB) {
      return m.homeScore > m.awayScore ? 1 : m.homeScore < m.awayScore ? -1 : 0;
    }
    if (m.home === teamB && m.away === teamA) {
      return m.homeScore > m.awayScore ? -1 : m.homeScore < m.awayScore ? 1 : 0;
    }
  }
  return 0;
}

function computeStandings(tournament, league) {
  const teams = {};
  for (const t of league.teams) {
    teams[t] = { team: t, mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
  }
  const matches = tournament.matches || [];
  for (const m of matches) {
    if (m.leagueId !== league.id) continue;
    if (m.kind && m.kind !== 'group') continue;
    if (m.homeScore == null || m.awayScore == null) continue;
    if (!teams[m.home] || !teams[m.away]) continue;
    teams[m.home].mp++; teams[m.away].mp++;
    teams[m.home].gf += m.homeScore; teams[m.home].ga += m.awayScore;
    teams[m.away].gf += m.awayScore; teams[m.away].ga += m.homeScore;
    if (m.homeScore > m.awayScore) { teams[m.home].w++; teams[m.home].pts += 3; teams[m.away].l++; }
    else if (m.homeScore < m.awayScore) { teams[m.away].w++; teams[m.away].pts += 3; teams[m.home].l++; }
    else { teams[m.home].d++; teams[m.away].d++; teams[m.home].pts++; teams[m.away].pts++; }
  }
  const medSet = new Set(league.medStudentTeams || []);
  const rows = Object.values(teams).map(r => ({ ...r, gd: r.gf - r.ga, isMed: medSet.has(r.team) }));
  rows.sort((a, b) => {
    if (a.isMed !== b.isMed) return a.isMed ? 1 : -1;
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.gd !== a.gd) return b.gd - a.gd;
    if (b.gf !== a.gf) return b.gf - a.gf;
    return -h2hResult(matches, league.id, a.team, b.team);
  });
  return rows;
}

// =========================================================
// Render
// =========================================================
function render() {
  renderTourPills();
  renderHero();
  renderTabs();
  renderPanel();
}

const SEASON_LABEL = { spring: '춘계', fall: '추계' };
const PILL_COUNT = 3;
const RECORDS_ID = 'records';
const OFFICERS_ID = 'officers';
let officersData = null;
const isSpecialView = (id) => id === RECORDS_ID || id === OFFICERS_ID;
let recMode = 'league'; // 'league' = 영맨·베테랑 나란히, 'all' = 클럽 합산

function tourLabel(t) {
  const base = t.shortName || t.name || t.id;
  if (t.status === 'cancelled') return `${base} · 미개최${t.cancelReason ? ` (${t.cancelReason})` : ''}`;
  return base;
}

function selectTournament(id) {
  currentTournamentId = id;
  currentTab = null; // reset to first available
  try { location.hash = id; } catch {}
  render();
}

function renderTourPills() {
  const pills = document.getElementById('tour-pills');
  pills.innerHTML = '';
  const list = Object.values(tournaments).sort((a, b) =>
    (b.date || '').localeCompare(a.date || '')
  );
  if (!list.length) {
    currentTournamentId = null;
    return;
  }
  if (!currentTournamentId || !tournaments[currentTournamentId]) {
    const h = (location.hash || '').replace('#', '');
    const firstHeld = list.find(t => t.status !== 'cancelled') || list[0];
    currentTournamentId = (h && (tournaments[h] || isSpecialView(h))) ? h : firstHeld.id;
  }
  pills.appendChild(el('button', {
    class: 'tour-pill records',
    role: 'tab',
    'aria-selected': currentTournamentId === OFFICERS_ID ? 'true' : 'false',
    onclick: () => selectTournament(OFFICERS_ID),
  }, '👥 임원진'));
  const recBtn = el('button', {
    class: 'tour-pill records',
    role: 'tab',
    'aria-selected': currentTournamentId === RECORDS_ID ? 'true' : 'false',
    onclick: () => selectTournament(RECORDS_ID),
  }, '🏆 역대 기록');
  pills.appendChild(recBtn);
  // 최근 대회 몇 개만 pill로, 나머지는 '지난 대회' 선택 목록으로
  const recent = list.filter(t => t.status !== 'cancelled').slice(0, PILL_COUNT);
  for (const t of recent) {
    const isOpen = t.registration && t.registration.open;
    const btn = el('button', {
      class: 'tour-pill',
      role: 'tab',
      'aria-selected': t.id === currentTournamentId ? 'true' : 'false',
      onclick: () => selectTournament(t.id),
    });
    if (isOpen) btn.appendChild(el('span', { class: 'live-dot', 'aria-label': '접수중' }));
    btn.appendChild(document.createTextNode(t.shortName || t.name || t.id));
    pills.appendChild(btn);
  }
  const recentIds = new Set(recent.map(t => t.id));
  const older = list.filter(t => !recentIds.has(t.id));
  if (older.length) {
    const inOlder = !recentIds.has(currentTournamentId) && !isSpecialView(currentTournamentId);
    const sel = el('select', {
      class: 'tour-select' + (inOlder ? ' active' : ''),
      'aria-label': '지난 대회 선택',
      onchange: (e) => { if (e.target.value) selectTournament(e.target.value); },
    });
    sel.appendChild(el('option', { value: '' }, `지난 대회 (${older.length})`));
    const byYear = new Map();
    for (const t of older) {
      const y = t.year || (t.date || '').slice(0, 4);
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(t);
    }
    for (const [y, ts] of byYear) {
      const og = el('optgroup', { label: `${y}년` });
      for (const t of ts) og.appendChild(el('option', { value: t.id }, tourLabel(t)));
      sel.appendChild(og);
    }
    sel.value = inOlder ? currentTournamentId : '';
    pills.appendChild(sel);
  }
}

function renderHero() {
  const hero = document.getElementById('hero');
  hero.innerHTML = '';
  if (currentTournamentId === OFFICERS_ID) {
    hero.appendChild(el('div', { class: 'hero-eyebrow' }, '대한의사축구연맹'));
    hero.appendChild(el('h1', { class: 'hero-title' }, '임원진'));
    hero.appendChild(el('div', { class: 'hero-meta' }, el('span', {}, '현 집행부와 역대 임원진을 소개합니다.')));
    return;
  }
  if (currentTournamentId === RECORDS_ID) {
    hero.appendChild(el('div', { class: 'hero-eyebrow' }, '대한의사축구연맹'));
    hero.appendChild(el('h1', { class: 'hero-title' }, '역대 기록'));
    hero.appendChild(el('div', { class: 'hero-meta' }, el('span', {}, '기록이 남아 있는 대회의 우승·시상 결과를 모았습니다.')));
    return;
  }
  const t = tournaments[currentTournamentId];
  if (!t) {
    hero.appendChild(el('div', { class: 'hero-eyebrow' }, '대한의사축구연맹'));
    hero.appendChild(el('h1', { class: 'hero-title' }, '의사축구대회 아카이브'));
    hero.appendChild(el('div', { class: 'hero-meta' }, el('span', {}, '등록된 대회가 없습니다.')));
    return;
  }
  hero.appendChild(el('div', { class: 'hero-eyebrow' }, '대한의사축구연맹'));
  hero.appendChild(el('h1', { class: 'hero-title' }, t.name));
  const meta = el('div', { class: 'hero-meta' });
  if (t.status === 'cancelled') {
    // 미개최: 날짜는 정렬용 값이라 표시하지 않음
  } else if (t.dateLabel || t.date) meta.appendChild(el('span', {}, [el('span', { class: 'label' }, '일시'), el('b', {}, t.dateLabel || fmtDate(t.date))]));
  if (t.venue) meta.appendChild(el('span', {}, [el('span', { class: 'label' }, '장소'), el('b', {}, t.venue)]));
  if (meta.childNodes.length) hero.appendChild(meta);
  if (t.status === 'cancelled') {
    hero.appendChild(el('div', { class: 'cancel-badge' }, `미개최${t.cancelReason ? ` · ${t.cancelReason}` : ''}`));
  }
  if (t.registration && t.registration.open) {
    const badge = el('div', { class: 'registration-badge' }, [
      el('span', { class: 'dot' }),
      el('span', {}, '참가 접수중'),
    ]);
    hero.appendChild(badge);
  }
}

function renderTabs() {
  document.getElementById('tabs').hidden = isSpecialView(currentTournamentId);
  if (isSpecialView(currentTournamentId)) return;
  const t = tournaments[currentTournamentId];
  if (!currentTab || !hasTabContent(t, currentTab)) {
    currentTab = firstAvailableTab(t);
  }
  for (const b of document.querySelectorAll('#tabs .tab')) {
    const tab = b.dataset.tab;
    const has = hasTabContent(t, tab);
    b.hidden = !has;
    b.textContent = tabLabel(t, tab);
    const on = tab === currentTab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.onclick = () => { currentTab = tab; renderTabs(); renderPanel(); };
  }
}

function renderPanel() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  if (currentTournamentId === RECORDS_ID) { renderRecords(panel); return; }
  if (currentTournamentId === OFFICERS_ID) { renderOfficers(panel); return; }
  const t = tournaments[currentTournamentId];
  if (!t) return;
  if (currentTab === 'info') renderInfo(panel, t);
  else if (currentTab === 'results') renderResults(panel, t);
  else if (currentTab === 'standings') renderStandings(panel, t);
  else if (currentTab === 'awards') renderAwards(panel, t);
  else if (currentTab === 'teams') renderTeams(panel, t);
  else if (currentTab === 'register') renderRegister(panel, t);
}

// --- Info panel ---
function mdHtml(text) {
  if (!text) return '';
  if (window.marked) {
    try { return window.marked.parse(text, { gfm: true, breaks: true }); } catch (e) { console.error(e); }
  }
  // Fallback: naive paragraph splitting
  return text.split(/\n\n+/).map(p => `<p>${p.replace(/</g, '&lt;').replace(/\n/g, '<br>')}</p>`).join('');
}

function renderInfo(panel, t) {
  if (t.notice) {
    const sec = el('div', { class: 'info-section' });
    sec.appendChild(el('div', { class: 'info-head' }, [
      el('h2', {}, '📣 공지사항'),
    ]));
    const body = el('div', { class: 'info-callout md' });
    body.innerHTML = mdHtml(t.notice);
    sec.appendChild(body);
    panel.appendChild(sec);
  }
  if (t.matches && t.matches.length) {
    const sec = renderScheduleGrid(t);
    if (sec) panel.appendChild(sec);
  }
  if (t.rules) {
    const sec = el('div', { class: 'info-section' });
    sec.appendChild(el('div', { class: 'info-head' }, [
      el('h2', {}, '📖 대회 요강'),
    ]));
    const body = el('div', { class: 'info-callout md' });
    body.innerHTML = mdHtml(t.rules);
    sec.appendChild(body);
    panel.appendChild(sec);
  }
  if (t.venueImages && t.venueImages.length) {
    const sec = el('div', { class: 'info-section' });
    sec.appendChild(el('div', { class: 'info-head' }, [
      el('h2', {}, '📍 구장 안내도'),
    ]));
    const grid = el('div', { class: 'venue-grid' });
    for (const img of t.venueImages) {
      const src = typeof img === 'string' ? img : img.src;
      const caption = typeof img === 'string' ? '' : (img.caption || '');
      const fig = el('figure', { class: 'venue-card' });
      const im = el('img', { src, alt: caption, loading: 'lazy', onclick: () => openLightbox(src) });
      fig.appendChild(im);
      if (caption) fig.appendChild(el('figcaption', {}, caption));
      grid.appendChild(fig);
    }
    sec.appendChild(grid);
    panel.appendChild(sec);
  }
}

// 일정표 그리드: 라운드별로 구장 컬럼에 경기 배치
function renderScheduleGrid(t) {
  const matches = t.matches || [];
  if (!matches.length) return null;

  // 1) 구장 수집
  const fieldSet = new Set();
  matches.forEach(m => { if (m.field) fieldSet.add(m.field); });
  const fields = [...fieldSet].sort((a, b) => {
    const na = (a.match(/\d+/) || ['99'])[0] | 0;
    const nb = (b.match(/\d+/) || ['99'])[0] | 0;
    return na - nb;
  });
  if (fields.length < 2) return null;

  // 2) 라운드별 그룹핑
  const byRound = new Map();
  matches.forEach(m => {
    const k = m.roundOrder != null ? m.roundOrder : 999;
    if (!byRound.has(k)) byRound.set(k, { round: m.round || '', matches: [] });
    byRound.get(k).matches.push(m);
  });

  const sec = el('div', { class: 'info-section' });
  sec.appendChild(el('div', { class: 'info-head' }, [
    el('h2', {}, '📅 일정표'),
  ]));

  const wrap = el('div', { class: 'schedule-grid-wrap' });
  const tbl = el('table', { class: 'schedule-grid' });

  // 헤더: 라운드 | 구장1 | 구장2 ...
  const thead = el('thead');
  const hr = el('tr');
  hr.appendChild(el('th', { class: 'sg-round-h' }, '라운드'));
  fields.forEach(f => hr.appendChild(el('th', { class: 'sg-field-h' }, f)));
  thead.appendChild(hr);
  tbl.appendChild(thead);

  const tbody = el('tbody');
  const keys = [...byRound.keys()].sort((a, b) => a - b);
  for (const k of keys) {
    const grp = byRound.get(k);
    const tr = el('tr');
    // 라운드 셀: 라벨 + 시간 범위
    const times = grp.matches.map(m => m.time).filter(Boolean);
    const timeHtml = times.length ? times.sort().filter((v, i, a) => a.indexOf(v) === i).join('<br>') : '';
    const roundTd = el('td', { class: 'sg-round-c' });
    roundTd.appendChild(el('div', { class: 'sg-round-label' }, grp.round || `R${k}`));
    tr.appendChild(roundTd);

    // 구장별 셀
    fields.forEach(field => {
      const fieldMatches = grp.matches.filter(m => m.field === field);
      const td = el('td', { class: 'sg-cell' });
      if (!fieldMatches.length) {
        td.appendChild(el('div', { class: 'sg-empty' }, '—'));
      } else {
        fieldMatches.forEach(m => {
          const game = el('div', { class: 'sg-game' + (m.leagueId === 'veteran' ? ' veteran' : ' young') });
          const topRow = el('div', { class: 'sg-game-top' });
          if (m.gameLabel) topRow.appendChild(el('span', { class: 'sg-game-label' }, m.gameLabel));
          if (m.time) topRow.appendChild(el('span', { class: 'sg-game-time' }, m.time));
          game.appendChild(topRow);
          const teams = el('div', { class: 'sg-game-teams' }, [
            el('span', { class: 'sg-team home' }, formatTeamName(m.home) || '-'),
            el('span', { class: 'sg-vs' }, 'vs'),
            el('span', { class: 'sg-team away' }, formatTeamName(m.away) || '-'),
          ]);
          game.appendChild(teams);
          td.appendChild(game);
        });
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);

  // 범례
  const legend = el('div', { class: 'sg-legend' }, [
    el('span', { class: 'sg-legend-chip young' }, '영맨'),
    el('span', { class: 'sg-legend-chip veteran' }, '베테랑'),
  ]);
  sec.appendChild(wrap);
  sec.appendChild(legend);

  // 원본 대진표·일정표 이미지 토글 (있는 경우)
  if (t.scheduleImages && t.scheduleImages.length) {
    const details = document.createElement('details');
    details.className = 'schedule-images-toggle';
    const summary = document.createElement('summary');
    summary.innerHTML = '📷 <span>원본 대진표 및 일정표 이미지 보기</span>';
    details.appendChild(summary);
    const imgGrid = el('div', { class: 'venue-grid', style: 'margin-top:14px' });
    for (const img of t.scheduleImages) {
      const src = typeof img === 'string' ? img : img.src;
      const caption = typeof img === 'string' ? '' : (img.caption || '');
      const fig = el('figure', { class: 'venue-card' });
      const im = el('img', { src, alt: caption, loading: 'lazy', onclick: () => openLightbox(src) });
      fig.appendChild(im);
      if (caption) fig.appendChild(el('figcaption', {}, caption));
      imgGrid.appendChild(fig);
    }
    details.appendChild(imgGrid);
    sec.appendChild(details);
  }

  return sec;
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('open');
}
document.addEventListener('click', (e) => {
  if (e.target.closest('.lightbox')) {
    document.getElementById('lightbox').classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// --- Results ---
function renderResults(panel, t) {
  const matches = t.matches || [];
  if (!matches.length) {
    panel.appendChild(el('div', { class: 'empty' }, '등록된 경기가 없습니다.'));
    return;
  }
  const byRound = new Map();
  for (const m of matches) {
    const key = m.roundOrder != null ? m.roundOrder : 999;
    if (!byRound.has(key)) byRound.set(key, { round: m.round || '', time: m.time || '', matches: [] });
    byRound.get(key).matches.push(m);
  }
  const fieldKey = (m) => {
    const match = (m.field || '').match(/(\d+)/);
    return match ? parseInt(match[1], 10) : 99;
  };
  const container = el('div', { class: 'rounds' });
  const keys = [...byRound.keys()].sort((a, b) => a - b);
  for (const k of keys) {
    const grp = byRound.get(k);
    // 구장 번호 오름차순, 같은 구장은 경기 시간 오름차순
    grp.matches.sort((a, b) => {
      const fa = fieldKey(a), fb = fieldKey(b);
      if (fa !== fb) return fa - fb;
      return (a.time || '').localeCompare(b.time || '');
    });
    const roundEl = el('div', { class: 'round' });
    roundEl.appendChild(el('div', {}, [
      el('div', { class: 'round-label' }, grp.round || ''),
      grp.time ? el('div', { class: 'round-time' }, grp.time) : null,
    ]));
    const mts = el('div', { class: 'matches' });
    for (const m of grp.matches) mts.appendChild(renderMatchCard(m, t));
    roundEl.appendChild(mts);
    container.appendChild(roundEl);
  }
  panel.appendChild(container);
}

function renderMatchCard(m, t) {
  const league = leagueById(t, m.leagueId);
  const kind = m.kind || 'group';
  const card = el('div', { class: 'match' + (kind !== 'group' ? ' playoff' : '') });
  if (kind === 'final') card.appendChild(el('div', { class: 'playoff-tag' }, 'FINAL'));
  else if (kind === 'third_place') card.appendChild(el('div', { class: 'playoff-tag' }, '3·4위전'));
  else if (kind === 'semifinal') card.appendChild(el('div', { class: 'playoff-tag' }, '준결승'));

  const head = el('div', { class: 'match-head' });
  head.appendChild(el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[m.leagueId] || 'var(--fg-muted)'}` }));
  head.appendChild(el('span', { class: 'league-name' }, league?.name || m.leagueId || ''));
  if (m.gameLabel) head.appendChild(el('span', { class: 'game-label' }, m.gameLabel));
  if (m.field || m.time) {
    const metaRight = el('span', { class: 'field-label' });
    if (m.field) metaRight.appendChild(document.createTextNode(m.field));
    if (m.time) {
      if (m.field) metaRight.appendChild(el('span', { class: 'match-time-sep' }, ' · '));
      metaRight.appendChild(el('span', { class: 'match-time' }, m.time));
    }
    head.appendChild(metaRight);
  }
  card.appendChild(head);

  const hasScore = m.homeScore != null && m.awayScore != null;
  const row = el('div', { class: 'match-row' });
  row.appendChild(el('div', { class: 'team home' }, formatTeamName(m.home)));
  row.appendChild(el('div', { class: 'score' + (hasScore ? '' : ' pending') }, hasScore ? `${m.homeScore} : ${m.awayScore}` : 'VS'));
  row.appendChild(el('div', { class: 'team away' }, formatTeamName(m.away)));
  card.appendChild(row);

  const hs = (m.homeScorers || []).map(fmtScorer).filter(Boolean);
  const as = (m.awayScorers || []).map(fmtScorer).filter(Boolean);
  if (hs.length || as.length) {
    const sc = el('div', { class: 'scorers' });
    const hDiv = el('div', { class: 'home' });
    hs.forEach(s => hDiv.appendChild(el('span', { class: 'scorer-row' }, s)));
    const aDiv = el('div', { class: 'away' });
    as.forEach(s => aDiv.appendChild(el('span', { class: 'scorer-row' }, s)));
    sc.appendChild(hDiv);
    sc.appendChild(aDiv);
    card.appendChild(sc);
  }

  if (m.penaltyWinner) card.appendChild(el('div', { class: 'penalty-note' }, `승부차기 · ${m.penaltyWinner} 우승`));
  else if (m.note) card.appendChild(el('div', { class: 'penalty-note' }, m.note));
  return card;
}

function fmtScorer(s) {
  if (!s) return '';
  if (typeof s === 'string') return s;
  const mins = Array.isArray(s.minutes) ? s.minutes.map(x => `${x}'`).join(', ') : '';
  const name = s.name || '';
  const tag = s.og ? ' (OG)' : s.wc ? ' (WC)' : '';
  return [name + tag, mins].filter(Boolean).join(' ');
}

// --- Standings ---
function renderStandings(panel, t) {
  const leagues = t.leagues || [];
  if (!leagues.length) { panel.appendChild(el('div', { class: 'empty' }, '등록된 리그가 없습니다.')); return; }
  for (const lg of leagues) {
    if (!(lg.teams || []).length) continue;
    const grp = el('div', { class: 'standings-group' });
    grp.appendChild(el('div', { class: 'standings-head' }, [
      el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[lg.id] || 'var(--fg-muted)'}` }),
      el('h2', {}, lg.name),
    ]));
    const rows = computeStandings(t, lg);
    const wrap = el('div', { class: 'standings-wrap' });
    const tbl = el('table', { class: 'standings-tbl' });
    tbl.innerHTML = `
      <thead><tr>
        <th class="rank-cell">순위</th>
        <th style="text-align:left; padding-left:16px">팀</th>
        <th>경기</th><th>승</th><th>무</th><th>패</th>
        <th>득</th><th>실</th><th>득실</th><th>승점</th>
      </tr></thead>`;
    const tbody = el('tbody');
    rows.forEach((r, i) => {
      const rank = i + 1;
      const medalCls = (!r.isMed && rank === 1) ? 'g1'
                      : (!r.isMed && rank === 2) ? 'g2'
                      : (!r.isMed && rank === 3 && rows.length >= 5) ? 'g3'
                      : '';
      const tr = el('tr');
      const gdCls = r.gd > 0 ? 'pos' : r.gd < 0 ? 'neg' : '';
      tr.innerHTML = `
        <td><span class="rank-medal ${medalCls}">${rank}</span></td>
        <td class="team-cell">${escapeHtml(formatTeamName(r.team))}${r.isMed ? '<span class="med-badge">의대생</span>' : ''}</td>
        <td class="num">${r.mp}</td><td class="num">${r.w}</td><td class="num">${r.d}</td><td class="num">${r.l}</td>
        <td class="num">${r.gf}</td><td class="num">${r.ga}</td>
        <td class="num gd ${gdCls}">${r.gd > 0 ? '+' : ''}${r.gd}</td>
        <td class="pts">${r.pts}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    grp.appendChild(wrap);
    grp.appendChild(el('div', { class: 'tiebreak-note' },
      `순위 결정: 승점 → 득실차 → 다득점 → 승자승${(lg.medStudentTeams || []).length ? ` · ${lg.medStudentTeams.join(', ')}은(는) 의대 학생 참가팀으로 성적과 무관하게 최하위 처리` : ''}`));
    panel.appendChild(grp);
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Awards ---
function renderAwards(panel, t) {
  const awards = t.awards || {};
  const keys = Object.keys(awards);
  if (!keys.length) { panel.appendChild(el('div', { class: 'empty' }, '시상 결과가 아직 등록되지 않았습니다.')); return; }
  const container = el('div', { class: 'awards' });
  for (const k of keys) {
    const a = awards[k];
    const card = el('div', { class: 'award-card' });
    const colorVar = LEAGUE_COLORS[a.leagueKey || k] || 'var(--accent)';
    card.appendChild(el('div', { class: 'award-head' }, [
      el('span', { class: 'league-dot', style: `background:${colorVar}; width:14px; height:14px` }),
      el('h2', {}, a.title || k),
    ]));
    const list = el('div', { class: 'award-list' });
    const rows = [
      a.champion   ? { label: '우승',    val: a.champion } : null,
      a.runnerUp   ? { label: '준우승',  val: a.runnerUp } : null,
      a.thirdPlace ? { label: '3위',    val: a.thirdPlace } : null,
      a.topScorer  ? { label: '득점왕',  val: formatPerson(a.topScorer, true) } : null,
      a.mvp        ? { label: 'MVP',    val: formatPerson(a.mvp) } : null,
    ].filter(Boolean);
    for (const r of rows) {
      const valEl = el('div', { class: 'award-val' });
      if (typeof r.val === 'string') valEl.textContent = r.val;
      else valEl.appendChild(r.val);
      list.appendChild(el('div', { class: 'award-row' }, [el('div', { class: 'award-label' }, r.label), valEl]));
    }
    card.appendChild(list);
    container.appendChild(card);
  }
  panel.appendChild(container);
}

function formatPerson(p, showGoals) {
  if (!p) return '';
  if (typeof p === 'string') return p;
  const parts = [];
  if (p.team) parts.push(p.team);
  const name = (p.name || '') + (p.number ? ` ${p.number}번` : '');
  if (name) parts.push(name + (p.wc ? ' (WC)' : '') + ' 선생님');
  const main = parts.join(' · ');
  if (showGoals && p.goals != null) {
    const wrap = el('span');
    wrap.appendChild(document.createTextNode(main));
    wrap.appendChild(el('span', { class: 'sub' }, `${p.goals}골`));
    return wrap;
  }
  return main;
}

// --- 임원진 ---
function renderOfficers(panel) {
  if (!officersData) { panel.appendChild(el('div', { class: 'empty' }, '임원진 정보를 불러오는 중입니다.')); return; }
  if (officersData.intro) panel.appendChild(el('p', { class: 'rec-note', style: 'margin:0 0 24px;font-size:13px;white-space:pre-line' }, officersData.intro));
  for (const term of officersData.terms || []) {
    const sec = el('div', { class: 'off-term' });
    sec.appendChild(el('div', { class: 'off-term-head' }, [
      el('h2', {}, term.title),
      term.current ? el('span', { class: 'off-badge' }, '현재') : null,
      term.period ? el('span', { class: 'period' }, term.period) : null,
    ]));
    for (const g of term.groups || []) {
      const grp = el('div', { class: 'off-group' });
      if (g.label) grp.appendChild(el('div', { class: 'off-group-label' }, g.label));
      if (g.compact) {
        const wrap = el('div', { class: 'off-compact' });
        for (const m of g.members) wrap.appendChild(el('span', {}, [m.role, el('b', {}, m.name)]));
        grp.appendChild(wrap);
      } else {
        const grid = el('div', { class: 'off-grid' });
        for (const m of g.members) {
          const lead = /^(회장|사무총장)$/.test(m.role);
          grid.appendChild(el('div', { class: 'off-card' + (lead ? ' lead' : '') }, [
            el('div', { class: 'off-role' }, m.role),
            el('div', { class: 'off-name' }, [m.name, m.team ? el('span', { class: 'off-team' }, m.team) : null]),
            m.note ? el('div', { class: 'off-note' }, m.note) : null,
          ]));
        }
        grp.appendChild(grid);
      }
      sec.appendChild(grp);
    }
    for (const n of term.notes || []) sec.appendChild(el('div', { class: 'off-src' }, n));
    if (term.source) sec.appendChild(el('div', { class: 'off-src' }, `출처: ${term.source}`));
    panel.appendChild(sec);
  }
}

// --- 역대 기록 ---
// 같은 클럽의 다른 표기(스쿼드명·약칭)를 하나로 묶어 우승 횟수를 셉니다.
const CLUB_ALIASES = {
  'FCM': 'FC Medicals', 'FC메디칼스': 'FC Medicals', '메디칼스': 'FC Medicals',
  '부산의대': '부산', '부산의대OB': '부산', '부산대': '부산', '부산시 의사축구단': '부산',
  '성남Y': '성남', '성남YB': '성남', '성남OB': '성남', '성남영맨': '성남', '성남베테랑': '성남',
};
// 전국대회 타이틀로 세는 리그 (지역리그는 표에만 표시)
const TITLE_LEAGUES = { young: '영맨', veteran: '베테랑', final: '왕중왕전' };

function leagueType(key) {
  const k = String(key || '');
  if (k.startsWith('young')) return 'young';
  if (k.startsWith('veteran')) return 'veteran';
  return k;
}
const LEAGUE_ORDER = { young: 0, veteran: 1, final: 2 };
function cleanTeam(name) {
  return String(name || '').replace(/\s*\((승부차기|추정|공동)\)\s*/g, '').trim();
}
function clubOf(name) {
  const n = cleanTeam(name);
  if (!n) return '';
  if (CLUB_ALIASES[n]) return CLUB_ALIASES[n];
  if (/^SMU/i.test(n.replace(/\s/g, ''))) return 'SMU';
  return n;
}
function seasonShort(t) { return t.shortName || `${t.year} ${SEASON_LABEL[t.season] || ''}`; }

function personText(p) {
  if (!p) return '';
  if (typeof p === 'string') return p;
  const name = (p.name || '') + (p.goals != null ? ` (${p.goals}골)` : '');
  return p.team ? `${name} · ${p.team}` : name;
}

function renderRecords(panel) {
  const held = Object.values(tournaments)
    .filter(t => t.status !== 'cancelled' && t.awards && Object.keys(t.awards).length)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const today = new Date().toISOString().slice(0, 10);

  // 1) 팀별 우승 횟수
  // filter: null = 전체(클럽 합산, 왕중왕전 포함), 'young' / 'veteran' = 해당 리그만
  const tally = (filter) => {
    const clubs = new Map();
    for (const t of held) {
      for (const [k, a] of Object.entries(t.awards)) {
        const key = leagueType(a.leagueKey || k);
        if (!TITLE_LEAGUES[key] || !a.champion) continue;
        if (filter && key !== filter) continue;
        const club = clubOf(a.champion);
        if (!club) continue;
        if (!clubs.has(club)) clubs.set(club, { club, titles: [], split: {} });
        const c = clubs.get(club);
        c.titles.push({ t, league: TITLE_LEAGUES[key], raw: cleanTeam(a.champion) });
        c.split[TITLE_LEAGUES[key]] = (c.split[TITLE_LEAGUES[key]] || 0) + 1;
      }
    }
    return [...clubs.values()].sort((a, b) =>
      b.titles.length - a.titles.length ||
      (b.titles[0].t.date || '').localeCompare(a.titles[0].t.date || '') ||
      a.club.localeCompare(b.club, 'ko'));
  };
  const teamGrid = (ranked, showSplit) => {
    const grid = el('div', { class: 'rec-teams' });
    let prevCount = null, rank = 0;
    ranked.forEach((c, i) => {
      if (c.titles.length !== prevCount) { rank = i + 1; prevCount = c.titles.length; }
      const card = el('div', { class: 'rec-team' });
      card.appendChild(el('div', { class: 'rec-team-top' }, [
        el('span', { class: 'rec-rank' + (rank === 1 ? ' top' : '') }, String(rank)),
        el('span', { class: 'rec-team-name' }, c.club),
        el('span', { class: 'rec-count' }, [String(c.titles.length), el('small', {}, '회')]),
      ]));
      card.appendChild(el('div', { class: 'rec-stars', 'aria-hidden': 'true' }, '★'.repeat(c.titles.length)));
      if (showSplit) card.appendChild(el('div', { class: 'rec-split' },
        Object.entries(c.split).map(([k, v]) => `${k} ${v}`).join(' · ')));
      const chips = el('div', { class: 'rec-titles' });
      for (const x of c.titles) {
        const label = `${seasonShort(x.t)}` + (showSplit ? ` ${x.league}` : '') + (x.raw !== c.club ? ` (${x.raw})` : '');
        chips.appendChild(el('button', { class: 'rec-chip', onclick: () => selectTournament(x.t.id) }, label));
      }
      card.appendChild(chips);
      grid.appendChild(card);
    });
    if (!ranked.length) grid.appendChild(el('div', { class: 'empty' }, '기록이 없습니다.'));
    return grid;
  };

  const sec1 = el('div', { class: 'rec-section' });
  const toggle = el('div', { class: 'rec-toggle', role: 'group', 'aria-label': '집계 방식' });
  [['league', '영맨 · 베테랑'], ['all', '전체 (클럽 합산)']].forEach(([mode, label]) => {
    toggle.appendChild(el('button', {
      'aria-pressed': recMode === mode ? 'true' : 'false',
      onclick: () => { recMode = mode; renderPanel(); },
    }, label));
  });
  sec1.appendChild(el('div', { class: 'rec-head' }, [
    el('h2', {}, '팀별 우승 횟수'),
    el('span', { class: 'sub' }, '★ = 우승 1회'),
    toggle,
  ]));
  if (recMode === 'all') {
    sec1.appendChild(teamGrid(tally(null), true));
    sec1.appendChild(el('div', { class: 'rec-note' },
      '영맨·베테랑·왕중왕전(2014~2015, 연령 구분 전) 우승을 클럽 단위로 합산했습니다. 같은 클럽의 스쿼드는 하나로 셉니다 (예: SMU A·SMU YB·SMU 블루 → SMU, 성남영맨·성남베테랑 → 성남, 부산의대·부산의대OB·부산대 → 부산, FCM → FC Medicals). 지역리그 우승은 넣지 않았습니다.'));
  } else {
    const cols = el('div', { class: 'rec-cols' });
    for (const [key, name] of [['young', '영맨'], ['veteran', '베테랑']]) {
      const col = el('div');
      col.appendChild(el('div', { class: 'rec-col-head' }, [
        el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[key]}` }), `${name} 리그`,
      ]));
      col.appendChild(teamGrid(tally(key), false));
      cols.appendChild(col);
    }
    sec1.appendChild(cols);
    sec1.appendChild(el('div', { class: 'rec-note' },
      '같은 클럽의 스쿼드는 하나로 셉니다 (예: SMU A·SMU YB·SMU 블루 → SMU, 성남영맨·성남베테랑 → 성남, 부산의대 → 부산). 2014~2015 왕중왕전은 연령 구분이 없던 대회라 ‘전체’에서만 셉니다.'));
  }
  panel.appendChild(sec1);

  // 2) 역대 시상 결과 표
  const sec2 = el('div', { class: 'rec-section' });
  sec2.appendChild(el('div', { class: 'rec-head' }, [
    el('h2', {}, '역대 시상 결과'),
    el('span', { class: 'sub' }, `${held.length}개 대회 · 기록이 없는 칸은 –`),
  ]));
  const wrap = el('div', { class: 'standings-wrap' });
  const tbl = el('table', { class: 'standings-tbl rec-tbl' });
  tbl.innerHTML = '<thead><tr><th>대회</th><th>리그</th><th>우승</th><th>준우승</th><th>MVP</th><th>득점왕</th></tr></thead>';
  const tbody = el('tbody');
  const dash = () => el('span', { class: 'dash' }, '–');
  for (const t of held) {
    const entries = Object.entries(t.awards).sort(([ka, a], [kb, b]) =>
      (LEAGUE_ORDER[leagueType(a.leagueKey || ka)] ?? 9) - (LEAGUE_ORDER[leagueType(b.leagueKey || kb)] ?? 9));
    entries.forEach(([k, a], idx) => {
      const tr = el('tr', { class: idx === 0 ? 'group-start' : '' });
      const nameTd = el('td', { class: 't-name' });
      if (idx === 0) nameTd.appendChild(el('button', { onclick: () => selectTournament(t.id) }, seasonShort(t)));
      tr.appendChild(nameTd);
      tr.appendChild(el('td', {}, (a.title || k).replace(/ 리그$/, '')));
      tr.appendChild(el('td', { class: 'champ' }, a.champion ? `🏆 ${a.champion}` : dash()));
      tr.appendChild(el('td', {}, a.runnerUp || dash()));
      tr.appendChild(el('td', {}, a.mvp ? personText(a.mvp) : dash()));
      tr.appendChild(el('td', {}, a.topScorer ? personText(a.topScorer) : dash()));
      tbody.appendChild(tr);
    });
  }
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  sec2.appendChild(wrap);
  const missing = Object.values(tournaments)
    .filter(t => t.status !== 'cancelled' && !(t.awards && Object.keys(t.awards).length) && (t.date || '') < today)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
    .map(seasonShort);
  if (missing.length) sec2.appendChild(el('div', { class: 'rec-note' }, `시상 기록이 아직 없는 대회: ${missing.join(', ')}`));
  panel.appendChild(sec2);
}

// --- Teams ---
function renderTeams(panel, t) {
  const leagues = t.leagues || [];
  if (!leagues.length) { panel.appendChild(el('div', { class: 'empty' }, '참가팀 정보가 없습니다.')); return; }
  for (const lg of leagues) {
    if (!(lg.teams || []).length) continue;
    const sec = el('div', { class: 'teams-section' });
    sec.appendChild(el('div', { class: 'standings-head' }, [
      el('span', { class: 'league-dot', style: `background:${LEAGUE_COLORS[lg.id] || 'var(--fg-muted)'}` }),
      el('h2', {}, lg.name),
    ]));
    const chips = el('div', { class: 'teams-chips' });
    const medSet = new Set(lg.medStudentTeams || []);
    for (const tm of lg.teams || []) {
      const isMed = medSet.has(tm);
      chips.appendChild(el('span', { class: 'team-chip' + (isMed ? ' med' : '') }, formatTeamName(tm) + (isMed ? ' · 의대생' : '')));
    }
    sec.appendChild(chips);
    panel.appendChild(sec);
  }
}

const statusCache = {};   // { tournamentId: { teams:[], players:[], fetchedAt } }
const statusLoading = {}; // { tournamentId: boolean }

function renderStatusView(t) {

async function loadStatus(t, body) {
  const endpoint = t.registration && t.registration.apiEndpoint;
  if (!endpoint) {
    body.appendChild(el('div', { class: 'empty' }, '등록 현황을 조회할 수 없습니다.'));
    return;
  }

  // Serve from cache if fresh (< 30s)
  const cached = statusCache[t.id];
  if (cached && (Date.now() - cached.fetchedAt) < 30000) {
    renderStatusData(body, t, cached);
    return;
  }

  if (statusLoading[t.id]) {
    body.appendChild(el('div', { class: 'status-loading' }, '불러오는 중...'));
    return;
  }
  statusLoading[t.id] = true;
  body.appendChild(el('div', { class: 'status-loading' }, '불러오는 중...'));

  try {
    const url = endpoint + '?action=status&tournamentId=' + encodeURIComponent(t.id);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    statusCache[t.id] = {
      teams: data.teams || [],
      players: data.players || [],
      fetchedAt: Date.now(),
    };
    body.innerHTML = '';
    renderStatusData(body, t, statusCache[t.id]);
  } catch (e) {
    console.error('status fetch failed', e);
    body.innerHTML = '';
    body.appendChild(el('div', { class: 'empty' }, '등록 현황을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'));
  } finally {
    statusLoading[t.id] = false;
  }
}

function renderStatusData(body, t, data) {
  const teams = data.teams || [];
  const players = data.players || [];

  // Build league & team ordering from tournament's official league/team lists.
  // Rule: 베테랑 league first, then 영맨; within each league, team order follows leagues[].teams order.
  const leagueRank = {};    // leagueName (e.g. "베테랑") → 0 = first, 1 = second, ...
  const teamOrder = {};     // teamName → { leagueRank, teamIdx, leagueName }
  (t.leagues || []).forEach(lg => {
    const nm = lg.name || lg.id;
    const isVet = (lg.id === 'veteran') || (nm && nm.indexOf('베테랑') !== -1);
    leagueRank[nm] = isVet ? 0 : 1;
    (lg.teams || []).forEach((tm, idx) => {
      teamOrder[tm] = { leagueRank: leagueRank[nm], teamIdx: idx, leagueName: nm };
    });
  });
  const resolveTeamOrder = (name) => {
    if (!name) return null;
    if (teamOrder[name]) return teamOrder[name];
    // Fallback: find a team whose name contains or is contained in the given name
    // (handles slight differences between sheet name and official team name)
    for (const [tn, info] of Object.entries(teamOrder)) {
      if (name.indexOf(tn) !== -1 || tn.indexOf(name) !== -1) return info;
    }
    return null;
  };
  const cmpTeam = (a, b) => {
    const oa = resolveTeamOrder(a), ob = resolveTeamOrder(b);
    if (oa && ob) {
      if (oa.leagueRank !== ob.leagueRank) return oa.leagueRank - ob.leagueRank;
      return oa.teamIdx - ob.teamIdx;
    }
    if (oa) return -1;  // known teams before unknown
    if (ob) return 1;
    return (a || '').localeCompare(b || '', 'ko');
  };

  // Overview stats
  const stats = el('div', { class: 'status-stats' });
  const leagueCounts = {};
  teams.forEach(team => {
    const lg = (team.league || '').trim() || '미지정';
    leagueCounts[lg] = (leagueCounts[lg] || 0) + 1;
  });
  stats.appendChild(el('div', { class: 'stat-card' }, [
    el('div', { class: 'stat-label' }, '신청 팀'),
    el('div', { class: 'stat-value' }, String(teams.length)),
  ]));
  stats.appendChild(el('div', { class: 'stat-card' }, [
    el('div', { class: 'stat-label' }, '등록 선수 (중복 포함)'),
    el('div', { class: 'stat-value' }, String(players.length)),
  ]));
  const lgEntries = Object.entries(leagueCounts).sort((a, b) =>
    (leagueRank[a[0]] ?? 99) - (leagueRank[b[0]] ?? 99)
  );
  for (const [lg, cnt] of lgEntries) {
    stats.appendChild(el('div', { class: 'stat-card' }, [
      el('div', { class: 'stat-label' }, `${lg} 리그`),
      el('div', { class: 'stat-value' }, String(cnt)),
    ]));
  }
  body.appendChild(stats);

  // Teams section
  const teamsSec = el('div', { class: 'status-section' });
  teamsSec.appendChild(el('h3', { class: 'status-section-title' }, `🏳️ 등록팀 (${teams.length}팀)`));
  if (!teams.length) {
    teamsSec.appendChild(el('div', { class: 'empty', style: 'padding:20px' }, '아직 신청한 팀이 없습니다.'));
  } else {
    // Group by league, then order leagues (veteran first) and teams (by tournament order)
    const byLeague = {};
    teams.forEach(team => {
      const lg = (team.league || '').trim() || '미지정';
      (byLeague[lg] = byLeague[lg] || []).push(team);
    });
    const leagueKeys = Object.keys(byLeague).sort((a, b) =>
      (leagueRank[a] ?? 99) - (leagueRank[b] ?? 99)
    );
    for (const lg of leagueKeys) {
      const list = byLeague[lg].slice().sort((a, b) => cmpTeam(a.teamName, b.teamName));
      const lgBlock = el('div', { class: 'status-league-block' });
      lgBlock.appendChild(el('div', { class: 'status-league-label' }, `${lg} · ${list.length}팀`));
      const chips = el('div', { class: 'teams-chips' });
      list.forEach(team => {
        chips.appendChild(el('span', { class: 'team-chip' }, formatTeamName(team.teamName) || '-'));
      });
      lgBlock.appendChild(chips);
      teamsSec.appendChild(lgBlock);
    }
  }
  body.appendChild(teamsSec);

  // Players section (grouped by team)
  // Build team → set of leagues from team registrations so we can color veteran-only teams differently.
  // Ambiguous teams (registered in both leagues) stay at default color because the player row has no league.
  const teamLeagues = {};
  teams.forEach(team => {
    const name = (team.teamName || '').trim();
    const lg = (team.league || '').trim();
    if (!name) return;
    (teamLeagues[name] = teamLeagues[name] || new Set()).add(lg);
  });
  const isVeteranOnly = (team) => {
    const set = teamLeagues[team];
    if (!set || set.size === 0) return false;
    if (set.size > 1) return false;
    return [...set][0].indexOf('베테랑') !== -1 || [...set][0].toLowerCase() === 'veteran';
  };

  const playersSec = el('div', { class: 'status-section' });
  playersSec.appendChild(el('h3', { class: 'status-section-title' }, `👤 선수 등록 (${players.length}명)`));
  if (!players.length) {
    playersSec.appendChild(el('div', { class: 'empty', style: 'padding:20px' }, '아직 등록된 선수가 없습니다.'));
  } else {
    // Group by team, dedupe by (team + name) keeping the latest submitted entry
    const byTeam = {};
    players.forEach(p => {
      const team = (p.teamName || '-').trim();
      const name = (p.name || '').trim();
      if (!name) return;
      (byTeam[team] = byTeam[team] || []).push(p);
    });
    // Order teams: 베테랑 first then 영맨, each in tournament-defined order
    const teamNames = Object.keys(byTeam).sort(cmpTeam);
    for (const team of teamNames) {
      const list = byTeam[team];
      const veteran = isVeteranOnly(team);
      // Dedupe: same name → keep last occurrence (latest edit)
      const seen = new Map();
      list.forEach(p => seen.set((p.name || '').trim(), p));
      const unique = [...seen.values()].sort((a, b) => {
        // Non-WC first, WC moved to the end
        const wa = a.isWildcard ? 1 : 0;
        const wb = b.isWildcard ? 1 : 0;
        if (wa !== wb) return wa - wb;
        // Within each group, number asc (missing numbers last), then name
        const na = parseInt(a.number, 10), nb = parseInt(b.number, 10);
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        if (!isNaN(na)) return -1;
        if (!isNaN(nb)) return 1;
        return (a.name || '').localeCompare(b.name || '', 'ko');
      });
      const block = el('div', { class: 'status-team-block' });
      block.appendChild(el('div', { class: 'status-team-head' }, [
        el('span', { class: 'status-team-name' }, formatTeamName(team)),
        el('span', { class: 'status-team-count' }, `${unique.length}명`),
      ]));
      const playersGrid = el('div', { class: 'status-players' });
      unique.forEach(p => {
        const num = p.number ? String(p.number).trim() : '';
        const chip = el('div', { class: 'player-chip' + (p.isWildcard ? ' wc' : '') });
        if (num) chip.appendChild(el('span', { class: 'player-num' + (veteran ? ' veteran' : '') }, num));
        chip.appendChild(el('span', { class: 'player-name' }, p.name || '-'));
        if (p.isWildcard) chip.appendChild(el('span', { class: 'player-wc', title: '와일드카드 (83년생 이하)' }, 'WC'));
        playersGrid.appendChild(chip);
      });
      block.appendChild(playersGrid);
      playersSec.appendChild(block);
    }
  }
  body.appendChild(playersSec);

  // Footer: last updated
  const dt = new Date(data.fetchedAt);
  const hh = String(dt.getHours()).padStart(2, '0');
  const mm = String(dt.getMinutes()).padStart(2, '0');
  const ss = String(dt.getSeconds()).padStart(2, '0');
  body.appendChild(el('div', { class: 'status-footer' }, `업데이트: ${hh}:${mm}:${ss}`));
}

function showToast(msg, variant = 'ok', duration = 4000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('error');
  if (variant === 'error') t.classList.add('error');
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

function postToSheets(endpoint, payload) {
  // Google Apps Script Web Apps don't play well with fetch+no-cors due to a 302 redirect
  // step that strips CORS headers. The reliable pattern is a hidden iframe form POST,
  // which the browser handles natively.
  return new Promise((resolve, reject) => {
    const iframeName = 'kmft-submit-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.action = endpoint;
    form.method = 'POST';
    form.target = iframeName;
    form.enctype = 'application/x-www-form-urlencoded';
    form.acceptCharset = 'UTF-8';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);

    document.body.appendChild(form);

    let settled = false;
    const cleanup = (ok) => {
      if (settled) return;
      settled = true;
      try { form.remove(); } catch {}
      setTimeout(() => { try { iframe.remove(); } catch {} }, 1500);
      if (ok) resolve(); else reject(new Error('submission timed out'));
    };

    iframe.addEventListener('load', () => setTimeout(() => cleanup(true), 200));
    // Hard timeout in case iframe never fires load (shouldn't happen but defensive)
    setTimeout(() => cleanup(true), 8000);

    try { form.submit(); } catch (e) { cleanup(false); }
  });
}

function buildMailtoUrl(to, subject, body) {
  return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

async function submitTeamForm(t, email, form) {
  const data = new FormData(form);
  const league = data.get('league');
  const leagueName = league === 'young' ? '영맨' : league === 'veteran' ? '베테랑' : league;
  const teamName = (data.get('teamName') || '').trim();
  const captain = (data.get('captain') || '').trim();
  const contact = (data.get('contact') || '').trim();
  const notes = (data.get('notes') || '').trim();

  const endpoint = t.registration && t.registration.apiEndpoint;
  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = '전송 중...'; }

  if (endpoint) {
    try {
      await postToSheets(endpoint, {
        type: 'team',
        tournamentId: t.id,
        tournamentName: t.name,
        league: leagueName,
        teamName, captain, contact, notes,
        submittedAt: new Date().toISOString(),
      });
      showToast('✅ 참가 신청이 접수되었습니다. 운영진이 확인 후 안내드리겠습니다.');
      form.reset();
      if (btn) { btn.disabled = false; btn.textContent = '📝 참가 신청 제출'; }
      return;
    } catch (e) {
      console.error('API submit failed', e);
      showToast('⚠️ 접수 중 오류가 발생했습니다. 메일로 전송합니다.', 'error');
    }
  }

  // Fallback: mailto
  const subject = `[${t.shortName || t.name} 참가신청] ${leagueName} - ${teamName}`;
  const bodyLines = [`대회: ${t.name}`, `리그: ${leagueName}`, `팀명: ${teamName}`, `단장: ${captain}`];
  if (contact) bodyLines.push(`연락처: ${contact}`);
  if (notes) bodyLines.push('', '비고:', notes);
  window.location.href = buildMailtoUrl(email, subject, bodyLines.join('\n'));
  if (btn) { btn.disabled = false; btn.textContent = '📝 참가 신청 제출'; }
}

async function submitPlayerForm(t, email, form) {
  const teamName = (form.querySelector('[name="teamName"]').value || '').trim();
  const captain = (form.querySelector('[name="captain"]').value || '').trim();
  const notes = (form.querySelector('[name="notes"]').value || '').trim();
  const rows = form.querySelectorAll('#roster-body tr');
  const players = [];
  rows.forEach(tr => {
    const name = tr.querySelector('[name="playerName"]').value.trim();
    const number = tr.querySelector('[name="playerNumber"]').value.trim();
    const birth = tr.querySelector('[name="playerBirthYear"]').value.trim();
    const hospital = tr.querySelector('[name="playerHospital"]').value.trim();
    if (name || number || birth || hospital) players.push({ name, number, birth, hospital });
  });
  if (!teamName) { alert('팀명을 입력해주세요.'); return; }
  if (!players.length) { alert('최소 1명 이상의 선수를 입력해주세요.'); return; }

  const endpoint = t.registration && t.registration.apiEndpoint;
  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = '전송 중...'; }

  if (endpoint) {
    try {
      await postToSheets(endpoint, {
        type: 'players',
        tournamentId: t.id,
        tournamentName: t.name,
        teamName, captain, notes, players,
        submittedAt: new Date().toISOString(),
      });
      showToast(`✅ ${players.length}명의 선수가 등록되었습니다.`);
      form.reset();
      // Re-add empty roster rows after reset
      const tbody = form.querySelector('#roster-body');
      if (tbody) { tbody.innerHTML = ''; for (let i = 0; i < 11; i++) addRosterRow(form); }
      if (btn) { btn.disabled = false; btn.textContent = '📝 선수 명단 제출'; }
      return;
    } catch (e) {
      console.error('API submit failed', e);
      showToast('⚠️ 접수 중 오류가 발생했습니다. 메일로 전송합니다.', 'error');
    }
  }

  // Fallback: mailto
  const subject = `[${t.shortName || t.name} 선수등록] ${teamName} (${players.length}명)`;
  const bodyLines = [`대회: ${t.name}`, `팀명: ${teamName}`];
  if (captain) bodyLines.push(`담당자: ${captain}`);
  bodyLines.push('', `선수 명단 (${players.length}명):`);
  bodyLines.push('이름 / 등번호 / 출생연도 / 소속병원');
  players.forEach((p, i) => {
    bodyLines.push(`${i + 1}. ${p.name || '-'} / ${p.number || '-'} / ${p.birth || '-'} / ${p.hospital || '-'}`);
  });
  if (notes) bodyLines.push('', '비고:', notes);
  window.location.href = buildMailtoUrl(email, subject, bodyLines.join('\n'));
  if (btn) { btn.disabled = false; btn.textContent = '📝 선수 명단 제출'; }
}

// =========================================================
// Theme toggle
// =========================================================
function initTheme() {
  try {
    const saved = localStorage.getItem('kmft-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch {}
  document.getElementById('theme-toggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    let next;
    if (cur === 'dark') next = 'light';
    else if (cur === 'light') next = 'dark';
    else next = sysDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('kmft-theme', next); } catch {}
  };
}

async function init() {
  initTheme();
  render();
  try {
    const res = await fetch('data/tournaments.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    const list = Array.isArray(payload) ? payload : (payload.tournaments || []);
    tournaments = {};
    for (const t of list) if (t && t.id) tournaments[t.id] = t;
    render();
    fetch('data/officers.json?v=' + Date.now())
      .then(r => r.ok ? r.json() : null)
      .then(j => { officersData = j; if (currentTournamentId === OFFICERS_ID) renderPanel(); })
      .catch(e => console.error('Failed to load officers.json', e));
  } catch (e) {
    console.error('Failed to load tournaments.json', e);
    document.getElementById('panel').innerHTML = '';
    document.getElementById('panel').appendChild(el('div', { class: 'empty' }, '대회 데이터를 불러오지 못했습니다.'));
  }
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#', '');
    if (h && (tournaments[h] || isSpecialView(h)) && h !== currentTournamentId) {
      currentTournamentId = h;
      currentTab = null;
      render();
    }
  });
}

init();
</script>
